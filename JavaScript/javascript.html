    }

  [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));

  const sideMenu = document.querySelector('.side-menu');

  if (sideMenu && sidebar.classList.contains('hide')) {
    const menuLinks = sideMenu.querySelectorAll('a');
    menuLinks.forEach(link => {
      const text = link.querySelector('.text')?.textContent.trim();
      if (text) {
        link.setAttribute('data-bs-toggle', 'tooltip');
        link.setAttribute('data-bs-placement', 'top');
        link.setAttribute('data-bs-custom-class', 'custom-tooltip');
        link.setAttribute('data-bs-title', text);
      }

    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {

    });

// ============================================================
// URL Hash Router & Page Persistence System
// ============================================================
function setAppHash(hash) {
  if (!hash) return;
  hash = String(hash).replace(/^#/, '');
  
  // 1. Save in localStorage for persistent reload
  try {
    localStorage.setItem('jk_active_hash', hash);
  } catch (e) {}

  // 2. Update browser history / address bar
  try {
    if (window.location.hash !== '#' + hash) {
      history.replaceState(null, null, '#' + hash);
    }
  } catch (e) {
    try { window.location.hash = hash; } catch (err) {}
  }

  // 3. Update Google Apps Script top-level iframe URL hash
  try {
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.replace(null, null, hash);
    }
  } catch (e) {}
}

function getAppHash() {
  let hash = '';
  try {
    if (window.location.hash) {
      hash = window.location.hash.replace(/^#/, '');
    }
  } catch (e) {}

  if (!hash) {
    try {
      hash = localStorage.getItem('jk_active_hash') || '';
    } catch (e) {}
  }
  return hash;
}

function syncSidebarActive(page, sub) {
  const pageNum = Number(page);
  const subNum = sub ? Number(sub) : null;
  const config = SIDEBAR_PAGE_MAP[pageNum];

  // 1. นำคลาส active ออกจาก li ในเมนูด้านข้างทั้งหมด
  $('#sidebar .side-menu.top li').removeClass('active');

  if (!config) {
    for (let j = 1; j <= 20; j++) {
      $(`#submenu${j}`).removeClass('show').addClass('none');
      $(`#fasubmane${j}`).removeClass('show click');
    }
    return;
  }

  // 2. กำหนด id ของเมนูที่ต้อง active
  let targetSidebarId = config.sidebarId || null;
  if (config.subs) {
    targetSidebarId = config.subs[subNum] || config.defaultSidebarId;
  }

  // 3. ใส่คลาส active ให้เมนูเป้าหมาย
  if (targetSidebarId) {
    const $target = $(`#${targetSidebarId}`);
    $target.addClass('active');

    // เลื่อน sidebar ให้เมนูที่ active อยู่ในสายตา
    try {
      const el = document.getElementById(targetSidebarId);
      if (el && typeof el.scrollIntoView === 'function') {
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    } catch (e) {}
  }

  // 4. จัดการ Submenu: กาง submenu ที่ตรงกับหน้านั้น และพับ submenu อื่นๆ
  for (let j = 1; j <= 20; j++) {
    if (config.submenuId && j === Number(config.submenuId)) {
      $(`#submenu${j}`).addClass('show').removeClass('none');
      $(`#fasubmane${j}`).addClass('show click');
    } else {
      $(`#submenu${j}`).removeClass('show').addClass('none');
      $(`#fasubmane${j}`).removeClass('show click');
    }
  }
}

function restorePageFromHash(targetHash) {
  const hash = targetHash || getAppHash();
  if (!hash) {
    return;
  }

  let page = null;
  let sub = null;

  if (hash.includes('=')) {
    const params = new URLSearchParams(hash);
    page = params.get('page') ? Number(params.get('page')) : null;
    sub = params.get('sub') ? Number(params.get('sub')) : null;
  } else if (/^\d+([/-]\d+)?$/.test(hash)) {
    const parts = hash.split(/[-/]/);
    page = Number(parts[0]);
    sub = parts[1] ? Number(parts[1]) : null;
  } else if (hash.startsWith('equipment') || hash.startsWith('equip')) {
    page = 23;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('checkbin')) {
    page = 22;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('esalary')) {
    page = 24;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('hrm')) {
    page = 20;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('land') || hash.startsWith('saveland')) {
    page = 21;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('page')) {
    const parts = hash.split(/[-/]/);
    page = parts[1] ? Number(parts[1]) : 1;
    sub = parts[2] ? Number(parts[2]) : null;
  }

  // ซิงค์ Active บน Sidebar ให้ตรงกับหน้านี้ทันที
  syncSidebarActive(page, sub);

  if (page === 23) {
    if (typeof changePageEquip === 'function') {
      changePageEquip(sub || 1, true);
    } else {
      changePage(23, true);
    }
  } else if (page === 22) {
    if (typeof changePageCheckBin === 'function') {
      changePageCheckBin(sub || 1, true);
    } else {
      changePage(22, true);
    }
  } else if (page === 24) {
    if (typeof changePageESalary === 'function') {
      changePageESalary(sub || 1, true);
    } else {
      changePage(24, true);
    }
  } else if (page === 20) {
    if (typeof changePageHrm === 'function') {
      changePageHrm(sub || 1, true);
    } else {
      changePage(20, true);
    }
  } else if (page === 21) {
    if (typeof changePageLand === 'function') {
      changePageLand(sub || 1, true);
    } else {
      changePage(21, true);
    }
  } else if (page === 2) {
    if (typeof changePageSenddoc === 'function') {
      changePageSenddoc(sub || 1, true);
    } else {
      changePage(2, true);
    }
  } else if (page === 3) {
    if (typeof changePageBookSend === 'function') {
      changePageBookSend(sub || 1, true);
    } else {
      changePage(3, true);
    }
  } else if (page === 4) {
    if (typeof changePageGetDoc === 'function') {
      changePageGetDoc(sub || 1, true);
    } else {
      changePage(4, true);
    }
  } else if (page === 5) {

  } else if (page === 6) {

function initAppHashRouter() {
  // ซิงค์หน้าและเมนูทันทีจาก localStorage / hash เริ่มต้น เพื่อความรวดเร็วและไม่กระพริบ
  const initialHash = getAppHash();
  if (initialHash) {
    restorePageFromHash(initialHash);
  } else {
    changePage(1, true);
  }

  if (typeof google !== 'undefined' && google.script && google.script.url) {
    google.script.url.getLocation(function (loc) {
      if (loc && loc.hash) {
        restorePageFromHash(loc.hash);
      }
    });
  }

  // Listen for browser Back / Forward buttons and manual hash changes
  window.addEventListener('hashchange', function () {
    const curHash = getAppHash();
    if (curHash) {
      restorePageFromHash(curHash);
    }
  });

  if (typeof google !== 'undefined' && google.script && google.script.history) {
    google.script.history.setChangeHandler(function (e) {
      if (e && e.hash) {
        restorePageFromHash(e.hash);
      }
    });
  }
}

function navigateToAppMenu(item) {
  if (!item || typeof item.action !== 'function') return;

  // 1. ซ่อนผลลัพธ์และเคลียร์ช่องค้นหา
  const $results = $('#menuSearchResults');
  const $input = $('#globalMenuSearch');
  $results.addClass('d-none').empty();
  $input.val('');
  $input.blur();

  // 2. เรียกใช้งานฟังก์ชันนำทางของเมนู
  item.action();

  // 3. ปรับสถานะ Active บน Sidebar
  if (item.sidebarId) {
    $('#sidebar .side-menu.top li').removeClass('active');
    $(`#${item.sidebarId}`).addClass('active');
  }

  // 4. เปิด Submenu อัตโนมัติหากมี
  if (item.submenuId) {
    for (let j = 1; j <= 20; j++) {
      $(`#submenu${j}`).removeClass('show').addClass('none');
      $(`#fasubmane${j}`).removeClass('show click');
    }
    $(`#submenu${item.submenuId}`).addClass('show').removeClass('none');
    $(`#fasubmane${item.submenuId}`).addClass('show click');
  }

  // 5. แจ้งเตือนสั้นๆ
  toastAlert(4, '🧭 ไปที่: ' + item.title);
}

function initGlobalMenuSearch() {
  const searchInput = document.getElementById('globalMenuSearch');
  const resultsContainer = document.getElementById('menuSearchResults');
  const searchBtn = document.getElementById('globalMenuSearchBtn');
  if (!searchInput || !resultsContainer) return;

  let currentResults = [];
  let selectedIndex = -1;

  function escapeStr(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderList(items, headerText, queryText = '') {
    currentResults = items;
    selectedIndex = -1;

    if (!items || items.length === 0) {
      resultsContainer.innerHTML = `
        <div class="p-3 text-center text-muted" style="font-size: 13px;">
          <i class="fa-regular fa-circle-question me-1 text-secondary"></i>
          ไม่พบเมนูหรือคำที่ตรงกับ "<strong>${escapeStr(queryText)}</strong>"
        </div>
      `;
      resultsContainer.classList.remove('d-none');
      return;
    }

    let html = `<div class="menu-search-header">${headerText} (${items.length})</div>`;
    items.forEach((item, index) => {
      let matchedKeywordHtml = '';
      if (queryText) {
        const qLower = queryText.toLowerCase();
        const matchedKw = (item.keywords || []).find(k => k.toLowerCase().includes(qLower) && !item.title.toLowerCase().includes(k.toLowerCase()));
        if (matchedKw) {
          matchedKeywordHtml = `<span class="menu-search-match-badge"><i class="fa-regular fa-tag me-1"></i>ตรงกับ: ${escapeStr(matchedKw)}</span>`;
        }
      }

      html += `
        <div class="menu-search-item" data-index="${index}">
          <div class="menu-search-icon"><i class="${item.icon || 'fa-regular fa-compass'}"></i></div>
          <div class="menu-search-info">
            <div class="menu-search-title">${escapeStr(item.title)}</div>
            <div class="menu-search-category">
              <span>${escapeStr(item.category)}</span>
              ${matchedKeywordHtml}
            </div>
          </div>
          <i class="fa-solid fa-arrow-turn-down-left text-muted small ms-auto opacity-50"></i>
        </div>
      `;
    });

    resultsContainer.innerHTML = html;
    resultsContainer.classList.remove('d-none');

    // ผูกเหตุการณ์คลิกเลือกรายการ
    const itemEls = resultsContainer.querySelectorAll('.menu-search-item');
    itemEls.forEach(el => {
      el.addEventListener('click', function () {
        const idx = parseInt(this.getAttribute('data-index'), 10);
        if (currentResults[idx]) {
          navigateToAppMenu(currentResults[idx]);
        }
      });
      el.addEventListener('mouseenter', function () {
        itemEls.forEach(item => item.classList.remove('active'));
        this.classList.add('active');
        selectedIndex = parseInt(this.getAttribute('data-index'), 10);
      });
    });
  }

  function doSearch(query) {
    const q = (query || '').trim().toLowerCase();
    if (!q) {
      // เมนูยอดนิยม / แนะนำเริ่มต้นเมื่อกดช่องค้นหา
      const recommended = appNavigationMenus.filter(m => 
        ['หน้าแรก (Dashboard)', 'สร้างหนังสือส่งภายใน', 'รายการหนังสือส่งภายใน', 'บันทึกเบิกพัสดุ', 'ขอใช้รถส่วนกลาง', 'ยื่นใบลา (ขออนุญาตลา)', 'ผู้ใช้งานระบบ'].includes(m.title)
      );
      renderList(recommended.length ? recommended : appNavigationMenus.slice(0, 8), '⚡ เมนูแนะนำด่วน');
      return;
    }

    // กรองค้นหาจากชื่อเมนู, หมวดหมู่, และคำสำคัญ
    const matches = [];
    appNavigationMenus.forEach(item => {
      const titleMatch = item.title.toLowerCase().includes(q);
      const categoryMatch = item.category.toLowerCase().includes(q);
      const keywordMatch = (item.keywords || []).some(k => k.toLowerCase().includes(q));

      if (titleMatch || categoryMatch || keywordMatch) {
        let score = 0;
        if (item.title.toLowerCase() === q) score += 100;
        else if (item.title.toLowerCase().startsWith(q)) score += 50;
        else if (titleMatch) score += 30;
        else if (keywordMatch) score += 20;
        else if (categoryMatch) score += 10;

        matches.push({ item, score });
      }
    });

    // เรียงลำดับความตรงกันจากมากไปน้อย
    matches.sort((a, b) => b.score - a.score);
    const topItems = matches.slice(0, 10).map(m => m.item);
    renderList(topItems, '🔍 ผลการค้นหาเมนู', query);
  }

  // Event Listeners
  searchInput.addEventListener('input', function () {
    doSearch(this.value);
  });

  searchInput.addEventListener('focus', function () {
    doSearch(this.value);
  });

  if (searchBtn) {
    searchBtn.addEventListener('click', function () {
      searchInput.focus();
      doSearch(searchInput.value);
    });
  }

  // ควบคุมผ่านแป้นพิมพ์ ArrowUp, ArrowDown, Enter, Esc
  searchInput.addEventListener('keydown', function (e) {
    const itemEls = resultsContainer.querySelectorAll('.menu-search-item');
    if (resultsContainer.classList.contains('d-none') || itemEls.length === 0) {
      if (e.key === 'ArrowDown' || e.key === 'Enter') {
        doSearch(this.value);
      }
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = (selectedIndex + 1) % itemEls.length;
      updateActiveItem(itemEls);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = (selectedIndex - 1 + itemEls.length) % itemEls.length;
      updateActiveItem(itemEls);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIndex >= 0 && currentResults[selectedIndex]) {
        navigateToAppMenu(currentResults[selectedIndex]);
      } else if (currentResults.length > 0) {
        navigateToAppMenu(currentResults[0]);
      }
    } else if (e.key === 'Escape') {
      resultsContainer.classList.add('d-none');
    }
  });

  function updateActiveItem(itemEls) {
    itemEls.forEach((el, idx) => {
      if (idx === selectedIndex) {
        el.classList.add('active');
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        el.classList.remove('active');
      }
    });
  }

  // ปิด Dropdown เมื่อคลิกนอกพื้นที่
  document.addEventListener('click', function (e) {
    const form = document.getElementById('menuSearchForm');
    if (form && !form.contains(e.target)) {
      resultsContainer.classList.add('d-none');
    }
  });

  // คีย์ลัดระดับ Global: Ctrl+K หรือ Cmd+K เพื่อเปิดค้นหาเมนูได้ทันทีจากทุกหน้า
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
      doSearch(searchInput.value);
    }
  });
}

      changePageGetDoc(lastActiveDocPage.sub && lastActiveDocPage.sub !== 4 ? lastActiveDocPage.sub : 1);

  }

const toastAlert = (status, text, delay = 3000) => {
    const toast = document.createElement('div');
    toast.className = 'toast toast-onload align-items-center border-0 rounded-4 shadow-lg fade show';
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    toast.setAttribute('aria-atomic', 'true');

    $('#loader').hide();
    let textStatus = "";
    let iconStatus = "";
    let bgColorClass = "";

    switch (status) {
        case 1:
        textStatus = "<i class='fa-duotone fa-thumbs-up'></i> สำเร็จ";
        iconStatus = "https://cdn.lordicon.com/oqdmuxru.json";
        bgColorClass = "bg-green";
        break;
        case 0:
        textStatus = "<i class='fa-duotone fa-triangle-exclamation'></i> ผิดพลาด";
        iconStatus = "https://cdn.lordicon.com/vihyezfv.json";
        bgColorClass = "bg-red";
        break;
        case 2:
        textStatus = "<i class='fa-duotone fa-cloud-question'></i> รายละเอียด";
        iconStatus = "https://cdn.lordicon.com/axteoudt.json";
        bgColorClass = "bg-violet";
        break;
        case 3:
        textStatus = "<i class='fa-duotone fa-bell'></i> แจ้งเตือน";
        iconStatus = "https://cdn.lordicon.com/vspbqszr.json";
        bgColorClass = "bg-yellow";
        break;
        default:
        textStatus = "<i class='fa-duotone fa-bullhorn'></i> ประกาศ";
        iconStatus = "https://cdn.lordicon.com/vyqvtrtg.json";
        bgColorClass = "bg-blue";
    }

    toast.classList.add(bgColorClass);

    toast.innerHTML = `
        <div class="toast-body d-flex align-items-center">
        <lord-icon
            src="${iconStatus}"
            trigger="loop"
            state="morph-check-in-1"
            colors="primary:#ffffff"
            style="width:40px;height:40px;margin-right:10px;">
        </lord-icon>
        <div>
            <h5 class="text-white mb-1">${textStatus}</h5>
            <h6 class="text-white mb-0">${text}</h6>
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    `;

    document.getElementById('toast-container').appendChild(toast);

    setTimeout(() => {
        $('#loader').hide();
        // console.clear();
        toast.classList.remove('show');
        toast.addEventListener('transitionend', () => {
        toast.remove();
        });
    }, delay);
}

const selectMooBan = (data) => {
  const groupedData = data.reduce((acc, cur) => {
    const village = cur[1];
    if (!acc[village]) {
      acc[village] = [];
    }
    acc[village].push(cur[2]);
    return acc;
  }, {});

  const mooNumber = document.getElementById('addReportNew1');
  const mooBan = document.getElementById('addReportNew2');
  const filterReport = document.getElementById('reportfilter3');
  const defaultOption1 = createOption('', 'โปรดเลือกหมู่บ้าน', true);
  const defaultOption2 = createOption('', 'โปรดเลือกชื่อบ้าน', true);

  mooNumber.appendChild(defaultOption1.cloneNode(true));
  mooBan.appendChild(defaultOption2.cloneNode(true));
  filterReport.appendChild(defaultOption1.cloneNode(true));

  Object.keys(groupedData).forEach(village => {
    const option = createOption(village, village);
    mooNumber.appendChild(option.cloneNode(true));
    filterReport.appendChild(option.cloneNode(true));
  });

  const updateHomeName = () => {
    const selectedVillage = mooNumber.value;
    mooBan.innerHTML = '';
    mooBan.appendChild(defaultOption2.cloneNode(true));
    if (selectedVillage) {
      const homes = groupedData[selectedVillage];
      if (homes.length > 0) {
        const firstHome = homes[0];
        const option = createOption(firstHome, firstHome);
        option.selected = true; 
        mooBan.appendChild(option);
      }
      homes.slice(1).forEach(home => {
        const option = createOption(home, home);
        mooBan.appendChild(option.cloneNode(true));
      });
    }
  }

  mooNumber.addEventListener('change', updateHomeName);
}

function initAllDropdowns() {
  const cached = sessionStorage.getItem('JK_DROPDOWN_DATA');
  if (cached) {
    try {
      const data = JSON.parse(cached);
      applyAllDropdownData(data);
      return;
    } catch(e) {}
  }
  google.script.run.withSuccessHandler((res) => {
    if (res) {
      try {
        sessionStorage.setItem('JK_DROPDOWN_DATA', JSON.stringify(res));
      } catch(e) {}
      applyAllDropdownData(res);
    }
  }).getAllDropdownData();
}

const saveFile_Doc = (f, runnumber, namefile) => {
  if (namefile == 1 && $('#docView10').text() === "ลงรับภายนอก") {

    $('#stampDocModal').modal('show');

      $('#confirmstampDocDocBtn').off('click').on('click', function() {
        $('#loader').show();
        const fileInput = document.getElementById('addFileDataDoc1');
        if (!fileInput.files.length) {
          toastAlert(0, 'Please select a PDF file');
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (event) => {
          const arrayBuffer = event.target.result;
          const pdfDoc = await PDFLib.PDFDocument.load(new Uint8Array(arrayBuffer));

          const page = pdfDoc.getPages()[0];
          const { width, height } = page.getSize();

          const watermarkDiv = document.getElementById('watermark');
          watermarkDiv.style.display = 'block';
          
          const canvas = document.getElementById('canvas');
          const canvasWidth = watermarkDiv.offsetWidth;
          const canvasHeight = watermarkDiv.offsetHeight;
          canvas.width = canvasWidth + 50;
          canvas.height = canvasHeight + 50;

          await html2canvas(watermarkDiv, {
            canvas: canvas,
            backgroundColor: null  
          });

          const imageData = canvas.toDataURL('image/png');
          const imageBytes = await fetch(imageData).then(res => res.arrayBuffer());
          const image = await pdfDoc.embedPng(imageBytes);

          page.drawImage(image, {
            x: width - canvasWidth - 8,
            y: height - canvasHeight - 8,
            width: canvasWidth,
            height: canvasHeight
          });

          const pdfBytes = await pdfDoc.save();
          
          const codes = $("#docViewKey").text();
          const obj = {
            code: codes,
            filename: codes + "_" + namefile,
            mimeType: 'application/pdf',
            bytes: [...new Int8Array(pdfBytes)]
          };

          google.script.run.withSuccessHandler(e => toastAlert(1, e)).saveFile(obj, runnumber);
          $('#stampDocModal').modal('hide');
        };
        reader.readAsArrayBuffer(file);
      });
  } else {
    $('#loader').show();

    const codes = $("#docViewKey").text();
    const file = f.files[0];
    const fr = new FileReader();
    fr.onload = function (e) {
      const obj = {
        code: codes,
        filename: codes + "_" + namefile,
        mimeType: file.type,
        bytes: [...new Int8Array(e.target.result)]
      };
      google.script.run.withSuccessHandler(e => toastAlert(1, e)).saveFile(obj, runnumber);
      
    };
    fr.readAsArrayBuffer(file);
  }
}

<script>
document.addEventListener("DOMContentLoaded", function() {
  const stepIndicators = document.querySelectorAll('[id^="stepIndicator"]');
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const saveProjectBtn = document.getElementById("saveProjectBtn");
  const documentContianer = document.getElementById("projectContianer");
  const stepTitles = [
    "stepIndicator1", "stepIndicator2", "stepIndicator3", "stepIndicator4", 
    "stepIndicator5", "stepIndicator6", "stepIndicator7", "stepIndicator8",
    "stepIndicator9", "stepIndicator10", "stepIndicator11", "stepIndicator12"
  ];
  let currentStep = 0;

  stepIndicators.forEach((indicator, index) => {
    indicator.addEventListener("click", () => goToStep(index));
  });
  
  const showStep = (stepIndex) => {
    $('#page10').stop().animate({ scrollTop: 100 }, 500);
    for (let i = 0; i < stepIndicators.length; i++) {
      if (i === stepIndex) {
        stepIndicators[i].classList.add("active");
        stepIndicators[i].classList.remove("finish");
      } else if (i < stepIndex) {
        stepIndicators[i].classList.add("finish");
        stepIndicators[i].classList.remove("active");
      } else {
        stepIndicators[i].classList.remove("active", "finish");
      }
    }

    const projectSteps = document.querySelectorAll('[id^="projectStep"]');
    for (let i = 0; i < projectSteps.length; i++) {
      if (i === stepIndex) {
        projectSteps[i].style.display = "block";
      } else {
        projectSteps[i].style.display = "none";
      }
    }

    if (stepIndex === stepIndicators.length - 1) {
      nextBtn.style.display = "none";
      saveProjectBtn.style.display = "inline-block";
      prevBtn.style.display = "inline-block";
    } else if (stepIndex === 0) {
      prevBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
      documentContianer.style.display = "none";
    } else {
      documentContianer.style.display = "inline-block";
      prevBtn.style.display = "inline-block";
      nextBtn.style.display = "inline-block";
      saveProjectBtn.style.display = "none";
    }
  }

  const goToStep = (stepIndex) => {
    currentStep = stepIndex;
    showStep(currentStep);
  }

  const nextStep = () => {
    if (currentStep < stepIndicators.length - 1) {
      currentStep++;
      showStep(currentStep);
    }
  }

  const prevStep = () => {
    if (currentStep > 0) {
      currentStep--;
      showStep(currentStep);
    }
  }

  nextBtn.addEventListener("click", nextStep);
  prevBtn.addEventListener("click", prevStep);

  showStep(currentStep);
});

  var totalPages = Math.ceil(data.length / itemsPerPage);

  var maxVisibleButtons = 5; 
  var startPage = 1;
  var endPage = totalPages;

  if (totalPages > maxVisibleButtons) {
    var middleButton = Math.floor(maxVisibleButtons / 2);
    var farthestStart = currentPage - middleButton;
    var farthestEnd = currentPage + middleButton - 1;

    if (farthestStart > 1) {
      startPage = farthestStart;
      if (farthestEnd < totalPages) {
        endPage = farthestEnd;
      } else {
        endPage = totalPages;
        startPage = totalPages - maxVisibleButtons + 1;
      }
    } else {
      startPage = 1;
      endPage = maxVisibleButtons;
    }
  }

  if (currentPage > 1) {
    var firstButton = document.createElement("button");
    firstButton.textContent = "1";

  for (var i = startPage; i <= endPage; i++) {
    var pageButton = document.createElement("button");
    pageButton.textContent = i;
    pageButton.className = "pagination-button fs-5";
    if (i === currentPage) {
      pageButton.disabled = true;
      pageButton.classList.add("active");
    } else {
      pageButton.addEventListener("click", (function (page) {
        return function () {
          currentPage = page;
          projectDataContainer(data);
        };
      })(i));
    }
    paginationContainer.appendChild(pageButton);
  }

  if (currentPage < totalPages) {
    var ellipsisButton2 = document.createElement("span");
    ellipsisButton2.textContent = "...";
    paginationContainer.appendChild(ellipsisButton2);

    var lastButton = document.createElement("button");
    lastButton.textContent = totalPages;
    lastButton.className = "pagination-button fs-5";
    lastButton.addEventListener("click", function () {
      currentPage = totalPages;
      projectDataContainer(data);
    });
    paginationContainer.appendChild(lastButton);
  }

  dataContainer.appendChild(paginationContainer);
}

let currentStep = 1;
const showStep = (n) => {
  const steps = document.querySelectorAll(".step");
  steps.forEach((step, index) => {
      step.classList.toggle("active", index === n - 1);
  });

  const indicators = document.querySelectorAll(".stepIndicator");
  indicators.forEach((indicator, index) => {
      indicator.classList.remove("active", "finish");
      if (index < n) indicator.classList.add("finish");
      if (index === n - 1) indicator.classList.add("active");
  });

  document.getElementById("prevRegisBtn").style.display = n === 1 ? "none" : "block";
  document.getElementById("cancelregictor").style.display = n === 1 ? "block" : "none";
  document.getElementById("nextRegisBtn").style.display = n === steps.length ? "none" : "block";
  document.getElementById("saveregictor").style.display = n === steps.length ? "block" : "none";
  if (n === 3 && $('#regictor_data11').val() === "") {
    $('#nextRegisBtn').prop('disabled', true);
  } else {
    $('#nextRegisBtn').prop('disabled', false);
  }
};

const nextPrev = (n) => {
  const steps = document.querySelectorAll(".step").length;
  if (currentStep + n > steps || currentStep + n < 1) return;
  currentStep += n;
  showStep(currentStep);
};

    toastAlert(0, "⚠️ กรุณากรอกหมายเลขโทรศัพท์");

  } else if ($("#dataProfile6").val() === "") {
    $("#dataProfile6").addClass("is-invalid");
    toastAlert(0, "⚠️ กรุณากรอกที่อยู่");
    return;
  }  

  $('#saveNewActivityModal').modal('show');

  $('#confirmSaveNewActivityBtn').on('click', ()=> {
    $("#loader").show();
    var obj = {
      key: $("#profileData6").text(),
      data1: $("#dataProfile3").val(),
      data2: $("#dataProfile8").val(),
      data3: $("#dataProfile9").val(),
      data4: $("#dataProfile4").val(),
      data5: $("#dataProfile6").val()
    }   

    google.script.run.withSuccessHandler((data) => {
      toastAlert(1, "👍 เปลี่ยนข้อมูลสำเร็จ");

      $('#saveNewActivityModal').modal('hide');
      localStorage.setItem('name_1', data.data1);
      localStorage.setItem('name_2', data.data2);
      localStorage.setItem('name_3', data.data3);
      localStorage.setItem('tel', data.data4);
      localStorage.setItem('address', data.data5);
    }).edit_Userchangedata(obj, ipCheck, userAgent);
  });
};

document.addEventListener("DOMContentLoaded", function () {

  }).getDataDrive();
})

const populateDataDriverlist = (data) => {
  const datalist = document.getElementById('listDriver');
  datalist.innerHTML = "";
  
  const listCode = Array.isArray(data) ? data : Array.from(data);
  
  listCode.forEach(code => {
      const option = document.createElement('option');
      option.value = code;
      datalist.appendChild(option);
  });
};

/**
 * showConfirmModal - แสดง Modal ยืนยันการดำเนินการ (แทน confirm)
 * @param {string} message - ข้อความที่ต้องการแสดง
 * @param {Function} onConfirm - callback เมื่อกดยืนยัน
 */
function showConfirmModal(message, onConfirm) {
  var msgEl = document.getElementById('confirmActionMessage');
  var btnEl = document.getElementById('confirmActionBtn');
  if (msgEl) msgEl.textContent = message;
  var modalEl = document.getElementById('confirmActionModal');
  var modal = new bootstrap.Modal(modalEl);
  // clone & replace เพื่อลบ event listener เก่า
  var newBtn = btnEl.cloneNode(true);
  btnEl.parentNode.replaceChild(newBtn, btnEl);
  newBtn.addEventListener('click', function() {
    modal.hide();
    if (typeof onConfirm === 'function') onConfirm();
  });
  modal.show();
}

/**
 * showAlertModal - แสดง Modal ข้อความแจ้งเตือน (แทน alert)
 * @param {string} message - ข้อความที่ต้องการแสดง
 */
function showAlertModal(message) {
  var msgEl = document.getElementById('infoAlertMessage');
  if (msgEl) msgEl.textContent = message;
  var modalEl = document.getElementById('infoAlertModal');
  var modal = new bootstrap.Modal(modalEl);
  modal.show();
}

</script>
