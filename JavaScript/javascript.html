// ============================================================
// URL Hash Router & Page Persistence System
// ============================================================
function setAppHash(hash) {
  if (!hash) return;
  hash = String(hash).replace(/^#/, '');
  
  // 1. Save in localStorage for persistent reload
  try {
    localStorage.setItem('jk_active_hash', hash);
  } catch (e) {}

  // 2. Update browser history / address bar
  try {
    if (window.location.hash !== '#' + hash) {
      history.replaceState(null, null, '#' + hash);
    }
  } catch (e) {
    try { window.location.hash = hash; } catch (err) {}
  }

  // 3. Update Google Apps Script top-level iframe URL hash
  try {
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.replace(null, null, hash);
    }
  } catch (e) {}
}

function getAppHash() {
  let hash = '';
  try {
    if (window.location.hash) {
      hash = window.location.hash.replace(/^#/, '');
    }
  } catch (e) {}

  if (!hash) {
    try {
      hash = localStorage.getItem('jk_active_hash') || '';
    } catch (e) {}
  }
  return hash;
}

function restorePageFromHash(targetHash) {
  const hash = targetHash || getAppHash();
  if (!hash) {
    changePage(1, true);
    return;
  }

  let page = null;
  let sub = null;

  if (hash.includes('=')) {
    const params = new URLSearchParams(hash);
    page = params.get('page') ? Number(params.get('page')) : null;
    sub = params.get('sub') ? Number(params.get('sub')) : null;
  } else if (/^\d+([/-]\d+)?$/.test(hash)) {
    const parts = hash.split(/[-/]/);
    page = Number(parts[0]);
    sub = parts[1] ? Number(parts[1]) : null;
  } else if (hash.startsWith('equipment') || hash.startsWith('equip')) {
    page = 23;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;

    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('esalary')) {

    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('hrm')) {

    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('land') || hash.startsWith('saveland')) {
    page = 21;
    const parts = hash.split(/[-/]/);
    sub = parts[1] ? Number(parts[1]) : 1;
  } else if (hash.startsWith('page')) {
    const parts = hash.split(/[-/]/);
    page = parts[1] ? Number(parts[1]) : 1;
    sub = parts[2] ? Number(parts[2]) : null;
  }

  if (page === 23) {
    if (typeof changePageEquip === 'function') {
      changePageEquip(sub || 1, true);
    } else {
      changePage(23, true);
    }
  } else if (page === 22) {

    }
  } else if (page === 24) {

    }
  } else if (page === 20) {

    }
  } else if (page === 21) {

    }
  } else if (page === 2) {

  } else if (page === 3) {

}

function initAppHashRouter() {
  if (typeof google !== 'undefined' && google.script && google.script.url) {
    google.script.url.getLocation(function (loc) {
      if (loc && loc.hash) {
        restorePageFromHash(loc.hash);
      } else {
        restorePageFromHash();
      }
    });
  } else {
    restorePageFromHash();
  }

  // Listen for browser Back / Forward buttons and manual hash changes
  window.addEventListener('hashchange', function () {
    restorePageFromHash();
  });

  if (typeof google !== 'undefined' && google.script && google.script.history) {
    google.script.history.setChangeHandler(function (e) {
      if (e && e.hash) {
        restorePageFromHash(e.hash);
      }
    });
  }
}

    }

    toast.classList.add(bgColorClass);

    toast.innerHTML = `

$('#chatDropdown').on('click', () => {
  const publicKey = localStorage.getItem('publicKey');

  let statusStack = 0;

  google.script.run.withSuccessHandler(data => {
    data.chatRooms.forEach((item, index) => {
      const now = new Date();
      const messageDate = new Date(item.timestamp);
      const diffTime = Math.abs(now - messageDate);
      const diffMinutes = Math.floor(diffTime / (1000 * 60));
      
      let timeText = `${diffMinutes} นาทีที่แล้ว`;
      if (diffMinutes >= 60) {
        const diffHours = Math.floor(diffMinutes / 60);
        timeText = `${diffHours} ชั่วโมงที่แล้ว`;
      }
      if (diffMinutes >= 1440) {
        timeText = messageDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) +
          ' ' + messageDate.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      }

      const existingChat = chatContainer.querySelector(`[data-chat="${item.roomId}"]`);
      if (existingChat) {
        existingChat.querySelector('.text-body-dark').textContent = item.lastMessage;
        existingChat.querySelector('.text-body-secondary').textContent = timeText;
      } else {
        var container = document.createElement('a');
        container.href = "javascript:void(0)";
        container.className = "py-2 px-3 d-flex align-items-center dropdown-item start-chat";
        container.dataset.chat = item.roomId;

          <span class="ratio ratio-1x1 overflow-hidden rounded-circle shadow-sm me-3 user-chat" style="width: 48px; height: 48px;">

              <h6 class="mb-0 fw-semibold lh-base limited-text">${data.users[index].fullname}</h6>
              <span class="text-body-secondary">${timeText}</span>  
            </div>
            <span class="d-block fw-light text-body-dark limited-text">${item.lastMessage}</span>
          </div>  
        `;
        if (item.status == 0) {
          statusStack++;
        }
        chatContainer.appendChild(container);
      }
    });

    if (statusStack == 0) {
      $('#chatStackNum, #chatStackNum2').addClass('d-none');
    } else {
      $('#chatStackNum, #chatStackNum2').removeClass('d-none');

    $('#chatStackNum').text(statusStack);

const checkboxReportcast = (data) => {  
  var checkboxData = [];

  for (var i = 0; i < data.length; i++) {
    const agencyName = data[i][7];
    const existingItem = checkboxData.find(item => item.name === agencyName);

    if (!existingItem) {
      checkboxData.push({
        name: agencyName,
        subItems: []
      });
    }
  }

  var checkboxContainer = document.getElementById("checkbox_Reportcast");

  checkboxData.forEach(function (section) {
    var filteredData = data.filter(function (item) {
      return item[7] === section.name;
    });

    var sectionDiv = document.createElement("div");
    sectionDiv.classList.add("mb-2", "ms-3");

    var sectionLink = document.createElement("a");
    var sectionIcon = document.createElement("i");
    sectionIcon.classList.add("fa-regular", "fa-chevron-right");
    sectionLink.appendChild(sectionIcon);
    sectionLink.appendChild(document.createTextNode(" " + section.name));
    sectionDiv.appendChild(sectionLink);

    sectionLink.addEventListener("click", function() {
      if (sectionIcon.classList.contains("fa-chevron-right")) {
        sectionIcon.classList.remove("fa-chevron-right");
        sectionIcon.classList.add("fa-chevron-down");
      } else {
        sectionIcon.classList.remove("fa-chevron-down");
        sectionIcon.classList.add("fa-chevron-right");
      }
    });

    var sectionCollapse = document.createElement("div");
    sectionCollapse.classList.add("collapse");
    sectionCollapse.id = "collapse" + section.name.replace(/\s+/g, '');
    var sectionContainer = document.createElement("div");
    sectionContainer.classList.add("container", "ms-2");

    var sectionCheckbox = document.createElement("input");
    sectionCheckbox.classList.add("form-check-input");
    sectionCheckbox.type = "checkbox";

    sectionCheckbox.addEventListener("change", function () {
      var checkboxes = sectionContainer.querySelectorAll('input[name="reportcast_Tokenline"]');
      checkboxes.forEach(function (checkbox) {
        checkbox.checked = sectionCheckbox.checked;
      });
    });

    var sectionLabel = document.createElement("label");
    sectionLabel.classList.add("form-check-label");
    sectionLabel.appendChild(sectionCheckbox);
    sectionLabel.appendChild(document.createTextNode(" เลือกทั้งหมด"));
    sectionContainer.appendChild(sectionLabel);

    var index = 0;

    section.subItems = filteredData.map(function (item) {
      return { label: item[0], checked: false, id: item[0], val: item[14], name: item[3] + item[4] + ' ' + item[5]}; 
    });

    section.subItems.forEach(function (item) {
      var itemDiv = document.createElement("div");
      itemDiv.classList.add("form-check");

      var input = document.createElement("input");
      input.classList.add("form-check-input");
      input.type = "checkbox";
      input.value = item.val;
      input.name = "reportcast_Tokenline";
      input.checked = item.checked;
      input.id = item.id + '_reportcast'; 

      var label = document.createElement("label");
      label.classList.add("form-check-label");
      label.setAttribute("for", item.id + "_reportcast"); 
      label.appendChild(document.createTextNode(item.name));

      itemDiv.appendChild(input);
      itemDiv.appendChild(label);
      sectionContainer.appendChild(itemDiv);
    });


    sectionCollapse.appendChild(sectionContainer);
    sectionDiv.appendChild(sectionCollapse);
    checkboxContainer.appendChild(sectionDiv);

    sectionLink.setAttribute("data-bs-toggle", "collapse");
    sectionLink.setAttribute("href", "#collapse" + section.name.replace(/\s+/g, ''));
    sectionLink.setAttribute("role", "button");
    sectionLink.setAttribute("aria-expanded", "false");
    sectionLink.setAttribute("aria-controls", "collapse" + section.name.replace(/\s+/g, ''));
  });
}
</script>

const selectMooBan = (data) => {
  const groupedData = data.reduce((acc, cur) => {
    const village = cur[1];
    if (!acc[village]) {
      acc[village] = [];
    }
    acc[village].push(cur[2]);
    return acc;
  }, {});

  const mooNumber = document.getElementById('addReportNew1');
  const mooBan = document.getElementById('addReportNew2');
  const filterReport = document.getElementById('reportfilter3');
  const defaultOption1 = createOption('', 'โปรดเลือกหมู่บ้าน', true);
  const defaultOption2 = createOption('', 'โปรดเลือกชื่อบ้าน', true);

  mooNumber.appendChild(defaultOption1.cloneNode(true));
  mooBan.appendChild(defaultOption2.cloneNode(true));
  filterReport.appendChild(defaultOption1.cloneNode(true));

  Object.keys(groupedData).forEach(village => {
    const option = createOption(village, village);
    mooNumber.appendChild(option.cloneNode(true));
    filterReport.appendChild(option.cloneNode(true));
  });

  const updateHomeName = () => {
    const selectedVillage = mooNumber.value;
    mooBan.innerHTML = '';
    mooBan.appendChild(defaultOption2.cloneNode(true));
    if (selectedVillage) {
      const homes = groupedData[selectedVillage];
      if (homes.length > 0) {
        const firstHome = homes[0];
        const option = createOption(firstHome, firstHome);
        option.selected = true; 
        mooBan.appendChild(option);
      }
      homes.slice(1).forEach(home => {
        const option = createOption(home, home);
        mooBan.appendChild(option.cloneNode(true));
      });
    }
  }

  mooNumber.addEventListener('change', updateHomeName);
}

  if (data.mooBan) selectMooBan(data.mooBan);
}

function initAllDropdowns() {
  const cached = sessionStorage.getItem('JK_DROPDOWN_DATA');
  if (cached) {
    try {
      const data = JSON.parse(cached);
      applyAllDropdownData(data);
      return;
    } catch(e) {}
  }
  google.script.run.withSuccessHandler((res) => {
    if (res) {
      try {
        sessionStorage.setItem('JK_DROPDOWN_DATA', JSON.stringify(res));
      } catch(e) {}
      applyAllDropdownData(res);
    }
  }).getAllDropdownData();
}

const saveFile_Doc = (f, runnumber, namefile) => {
  if (namefile == 1 && $('#docView10').text() === "ลงรับภายนอก") {

    $('#stampDocModal').modal('show');

      $('#confirmstampDocDocBtn').off('click').on('click', function() {
        $('#loader').show();
        const fileInput = document.getElementById('addFileDataDoc1');
        if (!fileInput.files.length) {
          toastAlert(0, 'Please select a PDF file');
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (event) => {
          const arrayBuffer = event.target.result;
          const pdfDoc = await PDFLib.PDFDocument.load(new Uint8Array(arrayBuffer));

          const page = pdfDoc.getPages()[0];
          const { width, height } = page.getSize();

          const watermarkDiv = document.getElementById('watermark');
          watermarkDiv.style.display = 'block';
          
          const canvas = document.getElementById('canvas');
          const canvasWidth = watermarkDiv.offsetWidth;
          const canvasHeight = watermarkDiv.offsetHeight;
          canvas.width = canvasWidth + 50;
          canvas.height = canvasHeight + 50;

          await html2canvas(watermarkDiv, {
            canvas: canvas,
            backgroundColor: null  
          });

          const imageData = canvas.toDataURL('image/png');
          const imageBytes = await fetch(imageData).then(res => res.arrayBuffer());
          const image = await pdfDoc.embedPng(imageBytes);

          page.drawImage(image, {
            x: width - canvasWidth - 8,
            y: height - canvasHeight - 8,
            width: canvasWidth,
            height: canvasHeight
          });

          const pdfBytes = await pdfDoc.save();
          
          const codes = $("#docViewKey").text();
          const obj = {
            code: codes,
            filename: codes + "_" + namefile,
            mimeType: 'application/pdf',
            bytes: [...new Int8Array(pdfBytes)]
          };

          google.script.run.withSuccessHandler(e => toastAlert(1, e)).saveFile(obj, runnumber);
          $('#stampDocModal').modal('hide');
        };
        reader.readAsArrayBuffer(file);
      });
  } else {
    $('#loader').show();

    const codes = $("#docViewKey").text();
    const file = f.files[0];
    const fr = new FileReader();
    fr.onload = function (e) {
      const obj = {
        code: codes,
        filename: codes + "_" + namefile,
        mimeType: file.type,
        bytes: [...new Int8Array(e.target.result)]
      };
      google.script.run.withSuccessHandler(e => toastAlert(1, e)).saveFile(obj, runnumber);
      
    };
    fr.readAsArrayBuffer(file);
  }
}

<script>
document.addEventListener("DOMContentLoaded", function() {
  const stepIndicators = document.querySelectorAll('[id^="stepIndicator"]');
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const saveProjectBtn = document.getElementById("saveProjectBtn");
  const documentContianer = document.getElementById("projectContianer");
  const stepTitles = [
    "stepIndicator1", "stepIndicator2", "stepIndicator3", "stepIndicator4", 
    "stepIndicator5", "stepIndicator6", "stepIndicator7", "stepIndicator8",
    "stepIndicator9", "stepIndicator10", "stepIndicator11", "stepIndicator12"
  ];
  let currentStep = 0;

  stepIndicators.forEach((indicator, index) => {
    indicator.addEventListener("click", () => goToStep(index));
  });
  
  const showStep = (stepIndex) => {
    $('#page10').stop().animate({ scrollTop: 100 }, 500);
    for (let i = 0; i < stepIndicators.length; i++) {
      if (i === stepIndex) {
        stepIndicators[i].classList.add("active");
        stepIndicators[i].classList.remove("finish");
      } else if (i < stepIndex) {
        stepIndicators[i].classList.add("finish");
        stepIndicators[i].classList.remove("active");
      } else {
        stepIndicators[i].classList.remove("active", "finish");
      }
    }

    const projectSteps = document.querySelectorAll('[id^="projectStep"]');
    for (let i = 0; i < projectSteps.length; i++) {
      if (i === stepIndex) {
        projectSteps[i].style.display = "block";
      } else {
        projectSteps[i].style.display = "none";
      }
    }

    if (stepIndex === stepIndicators.length - 1) {
      nextBtn.style.display = "none";
      saveProjectBtn.style.display = "inline-block";
      prevBtn.style.display = "inline-block";
    } else if (stepIndex === 0) {
      prevBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
      documentContianer.style.display = "none";
    } else {
      documentContianer.style.display = "inline-block";
      prevBtn.style.display = "inline-block";
      nextBtn.style.display = "inline-block";
      saveProjectBtn.style.display = "none";
    }
  }

  const goToStep = (stepIndex) => {
    currentStep = stepIndex;
    showStep(currentStep);
  }

  const nextStep = () => {
    if (currentStep < stepIndicators.length - 1) {
      currentStep++;
      showStep(currentStep);
    }
  }

  const prevStep = () => {
    if (currentStep > 0) {
      currentStep--;
      showStep(currentStep);
    }
  }

  nextBtn.addEventListener("click", nextStep);
  prevBtn.addEventListener("click", prevStep);

  showStep(currentStep);
});

  if (totalPages > maxVisibleButtons) {
    var middleButton = Math.floor(maxVisibleButtons / 2);
    var farthestStart = currentPage - middleButton;
    var farthestEnd = currentPage + middleButton - 1;

    if (farthestStart > 1) {
      startPage = farthestStart;
      if (farthestEnd < totalPages) {
        endPage = farthestEnd;
      } else {
        endPage = totalPages;
        startPage = totalPages - maxVisibleButtons + 1;
      }
    } else {
      startPage = 1;
      endPage = maxVisibleButtons;
    }
  }

  if (currentPage > 1) {
    var firstButton = document.createElement("button");
    firstButton.textContent = "1";
    firstButton.className = "pagination-button fs-5";
    firstButton.addEventListener("click", function () {
      currentPage = 1;
      projectDataContainer(data);
    });
    paginationContainer.appendChild(firstButton);

    var ellipsisButton1 = document.createElement("span");
    ellipsisButton1.textContent = "...";
    paginationContainer.appendChild(ellipsisButton1);
  }

  for (var i = startPage; i <= endPage; i++) {
    var pageButton = document.createElement("button");
    pageButton.textContent = i;
    pageButton.className = "pagination-button fs-5";
    if (i === currentPage) {
      pageButton.disabled = true;
      pageButton.classList.add("active");
    } else {
      pageButton.addEventListener("click", (function (page) {
        return function () {
          currentPage = page;
          projectDataContainer(data);
        };
      })(i));
    }
    paginationContainer.appendChild(pageButton);
  }

  if (currentPage < totalPages) {
    var ellipsisButton2 = document.createElement("span");
    ellipsisButton2.textContent = "...";
    paginationContainer.appendChild(ellipsisButton2);

    var lastButton = document.createElement("button");
    lastButton.textContent = totalPages;
    lastButton.className = "pagination-button fs-5";
    lastButton.addEventListener("click", function () {
      currentPage = totalPages;
      projectDataContainer(data);
    });
    paginationContainer.appendChild(lastButton);
  }

  dataContainer.appendChild(paginationContainer);
}

let currentStep = 1;
const showStep = (n) => {
  const steps = document.querySelectorAll(".step");
  steps.forEach((step, index) => {
      step.classList.toggle("active", index === n - 1);
  });

  const indicators = document.querySelectorAll(".stepIndicator");
  indicators.forEach((indicator, index) => {
      indicator.classList.remove("active", "finish");
      if (index < n) indicator.classList.add("finish");
      if (index === n - 1) indicator.classList.add("active");
  });

  document.getElementById("prevRegisBtn").style.display = n === 1 ? "none" : "block";
  document.getElementById("cancelregictor").style.display = n === 1 ? "block" : "none";
  document.getElementById("nextRegisBtn").style.display = n === steps.length ? "none" : "block";
  document.getElementById("saveregictor").style.display = n === steps.length ? "block" : "none";
  if (n === 3 && $('#regictor_data11').val() === "") {
    $('#nextRegisBtn').prop('disabled', true);
  } else {
    $('#nextRegisBtn').prop('disabled', false);
  }
};

const nextPrev = (n) => {
  const steps = document.querySelectorAll(".step").length;
  if (currentStep + n > steps || currentStep + n < 1) return;
  currentStep += n;
  showStep(currentStep);
};

    }).edit_Userchangedata(obj, ipCheck, userAgent);
  });
};

const setting_notify = (obj, event) => {
  event.preventDefault();
  $('#successFormModal').modal('show');

  $('#confirmSuccessBtn').off('click').on('click', ()=> {
      $('#loader').show();

      google.script.run.withSuccessHandler(()=> {
          toastAlert(1, '✨ บันทึกข้อมูลสำเร็จ');
          getSetting();
          $('#successFormModal').modal('hide');
      }).setting_notify(obj);
  });
};

document.addEventListener("DOMContentLoaded", function () {
  google.script.run.withSuccessHandler(res => {
    populateDataDriverlist(res)
  }).getDataDrive();
})

const populateDataDriverlist = (data) => {
  const datalist = document.getElementById('listDriver');
  datalist.innerHTML = "";
  
  const listCode = Array.isArray(data) ? data : Array.from(data);
  
  listCode.forEach(code => {
      const option = document.createElement('option');
      option.value = code;
      datalist.appendChild(option);
  });
};
</script>
