<script>
document.addEventListener("DOMContentLoaded", function () {
    function updateBuddhistYear(instance) {
        const buddhistYear = instance.currentYear + 543;
        instance.currentYearElement.value = buddhistYear;
    }

    $('.monthsSelect').flatpickr({
        disableMobile: true,
        defaultDate: "today", 
        locale: {
            months: {
                shorthand: ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."],
                longhand: ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"]
            }
        },
        plugins: [
            new monthSelectPlugin({
                shorthand: false,
                dateFormat: "m-Y", 
                altFormat: "F Y", 
            })
        ],
        altInput: true,
        onReady(selectedDates, dateStr, instance) {
            updateBuddhistYear(instance);

            const date = instance.selectedDates[0] || new Date(); 
            const thaiYear = date.getFullYear() + 543;
            const month = instance.l10n.months.longhand[date.getMonth()];
            instance.altInput.value = `${month} ${thaiYear}`;
        },
        onChange(selectedDates, dateStr, instance) {
            updateBuddhistYear(instance);

            const date = selectedDates[0];
            if (date) {
                const thaiYear = date.getFullYear() + 543;
                const month = instance.l10n.months.longhand[date.getMonth()];
                instance.altInput.value = `${month} ${thaiYear}`;
            }
        },
        onOpen(selectedDates, dateStr, instance) {
            updateBuddhistYear(instance);
        },
        onYearChange(selectedDates, dateStr, instance) {
            updateBuddhistYear(instance);
        },
        onMonthChange(selectedDates, dateStr, instance) {
            updateBuddhistYear(instance);
        },
    });


    $(".dateSelect, .monthsSelect, #monthTimeWorking, .timeSelect").removeClass('form-control');
    $(".flatpickr-next-month, .flatpickr-prev-month").hide();
});

}).getAllEmployee();

const populateSelectElements = (data) => {
    data.sort((a, b) => a.uid - b.uid);

    const selectElementIds = [
        'salaryAddData2',
    ];

    selectElementIds.forEach(id => {
        const select = document.getElementById(id);
        if (!select) {
            return;
        }

        select.innerHTML = '';

        const defaultOption = createOption('', 'โปรดเลือก', true);
        select.appendChild(defaultOption);

        data.forEach(row => {
            const option = createOption(row.uid, row.name);
            select.appendChild(option);
        });
    });
};

const selectEmployeeData = () => {
    const inputValue = document.getElementById('salaryAddData2');

};

function initializeCleave() {
    document.querySelectorAll('.input-thousand').forEach(input => {
        if (!input.dataset.cleaveInitialized) { 
            new Cleave(input, {
                numeral: true,
                numeralThousandsGroupStyle: 'thousand'
            });
            input.dataset.cleaveInitialized = true; 
        }
    });
}

document.querySelectorAll('.input-thousand').forEach(input => {

});

const calculateSalary = () => {
    const revenueInputs = document.querySelectorAll('[id^="salaryAddDatacount_revenue"]');
    let totalRevenue = 0;

    revenueInputs.forEach(input => {
        const value = parseFloat(input.value.replace(/,/g, '')); 
        if (!isNaN(value)) {
            totalRevenue += value;
        }
    });

    const expensesInputs = document.querySelectorAll('[id^="salaryAddDatacount_expenses"]');
    let totalExpenses = 0;

    expensesInputs.forEach(input => {
        const value = parseFloat(input.value.replace(/,/g, '')); 
        if (!isNaN(value)) {
            totalExpenses += value;
        }
    });

    const netTotal = totalRevenue - totalExpenses;

    const revenueField = document.getElementById('salaryAddData6');
    if (revenueField) {
        revenueField.value = totalRevenue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const expensesField = document.getElementById('salaryAddData7');
    if (expensesField) {
        expensesField.value = totalExpenses.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const totalField = document.getElementById('salaryAddData8');
    if (totalField) {
        totalField.value = netTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
};

const createAlternatingTable = (income, expenses) => {
    const maxLength = Math.max(income.length, expenses.length); 
    let tableRows = '';

    for (let i = 0; i < maxLength; i++) {
        const incomeItem = income[i] ? `<td>${income[i].item}</td><td>${income[i].amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>` : '<td></td><td></td>';
        const expenseItem = expenses[i] ? `<td>${expenses[i].item}</td><td>${expenses[i].amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>` : '<td></td><td></td>';
        tableRows += `<tr>${incomeItem}${expenseItem}</tr>`;
    }

    return tableRows;
};

const convertToThaiDate = (dateString) => {
  const [month, year] = dateString.split('-');

  const thaiMonths = [
    "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", 
    "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", 
    "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
  ];

  const thaiYear = parseInt(year) + 543;

  return `${thaiMonths[parseInt(month) - 1]} ${thaiYear}`;
};

const convertToThaiDateTimeSalary = (dateString) => {
    const date = new Date(dateString);

    const thaiMonths = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", 
        "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", 
        "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];

    const thaiDays = [
        "วันอาทิตย์", "วันจันทร์", "วันอังคาร", 
        "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"
    ];

    const day = thaiDays[date.getDay()];
    const dateNumber = date.getDate();
    const month = thaiMonths[date.getMonth()];
    const year = date.getFullYear() + 543;
    const hours = date.getHours().toString().padStart(2, '0'); 
    const minutes = date.getMinutes().toString().padStart(2, '0');
    const seconds = date.getSeconds().toString().padStart(2, '0'); 

    return `วันที่ ${dateNumber} ${month} ${year}`;
};

const addSalaryXls = () => {
    $("#addDataXlsSalaryModal").modal('show'); 
    $('#textDataXlsSalary').text('เพิ่มรายรับของพนักงานทั้งหมด').css('color', 'var(--box2)');

    document.getElementById('dataIncomeXlsMonthFile').addEventListener('change', function (e) {
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 }); 

            const headers = jsonData[0]; 
            const resultIncome = [];

            for (let i = 1; i < jsonData.length; i++) {
                const row = jsonData[i];
                const name = row[0]; 
                const uid = row[1]; 

                const rowData = [];

                for (let j = 4; j < headers.length; j++) {
                    if (headers[j] && row[j] !== undefined && row[j] !== "") { 
                        rowData.push({
                            item: headers[j], 
                            amount: row[j] 
                        });
                    }
                }

                if (rowData.length > 0 && uid) { 
                    resultIncome.push({
                        name: name || "", 
                        uid: uid || "", 
                        dateround: $('#dataXlsMonth').val() || "", 
                        details: rowData 
                    });
                }
            }

            if (resultIncome.length == 0) {
                toastAlert(3, 'ข้อมูลว่างเปล่า โปรดตรวจสอบข้อมูล');
                return;
            }

            $('#salaryFileIncomeContainer').hide();
            $('#salaryFileExpensesContainer').show();
            $('#salaryCountNum').text(resultIncome.length);
            $('#textDataXlsSalary').text('เพิ่มรายจ่ายของพนักงานทั้งหมด').css('color', 'var(--box4)');
            toastAlert(1, 'เพิ่มข้อมูลสำเร็จ');

            document.getElementById('dataExpensesXlsMonthFile').addEventListener('change', function (e) {
                const file = e.target.files[0];
                const reader = new FileReader();

                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 }); 

                    const headers = jsonData[0]; 
                    const resultExpenses = [];

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        const total = row[1]; 
                        const income = row[2]; 
                        const expenses = row[3]; 
                        const nameExpenses = row[0]; 

                        const rowData = [];

                        for (let j = 5; j < headers.length; j++) {
                            if (headers[j] && row[j] !== undefined && row[j] !== "") { 
                                rowData.push({
                                    item: headers[j], 
                                    amount: row[j]
                                });
                            }
                        }

                        if (row[0]) {
                            resultExpenses.push({
                                nameExpenses: nameExpenses || "",
                                total: total || "",
                                income: income || "",
                                expenses: expenses || "",
                                details: rowData 
                            });
                        }
                    }

                    if (resultExpenses.length == 0) {
                        toastAlert(3, 'ข้อมูลว่างเปล่า โปรดตรวจสอบข้อมูล');
                        return;
                    }

                    if ($('#dataXlsMonth').val() === "") {
                        toastAlert(3, 'โปรดเลือกเดือนที่ต้องการบันทึก');
                        return;
                    }
                    
                    $('#salaryCountNum').text(resultExpenses.length);
                    $('#confirmDataXlsSalaryBtn').prop('disabled', false);

                    $('#confirmDataXlsSalaryBtn').off('click').on('click', function () {
                        $("#loader").show();
                        google.script.run
                            .withSuccessHandler((response) => {
                                if (response.success) {
                                    toastAlert(1, 'บันทึกข้อมูลเรียบร้อยแล้ว');
                                    $('#confirmDataXlsSalaryBtn').prop('disabled', true);
                                    $("#addDataXlsSalaryModal").modal('hide'); 
                                    $('#textDataXlsSalary').text('เพิ่มรายรับของพนักงานทั้งหมด').css('color', 'var(--box2)');
                                    $('#salaryFileIncomeContainer').show();
                                    $('#salaryFileExpensesContainer').hide();
                                    $('#salaryCountNum').text("0");
                                } else {
                                    toastAlert(0, 'เกิดข้อผิดพลาด: ' + response.error);
                                }
                            })
                            .addDataSalaryFileIncome(resultIncome, resultExpenses);

                        return false;
                    });
                };

                reader.readAsArrayBuffer(file);
            });
        };

        reader.readAsArrayBuffer(file);
    });
};

const populateTableSalary = (data) => {
    $('#salaryCountNo1').text(data.length);
    let revenue = 0;
    let expense = 0;

    if (!data || data.length === 0) {
        $('#table_DashboradEmployeeSalary tbody').html(`
            <tr>
                <td colspan="6">
                    <div class="d-flex justify-content-center align-items-center flex-column">
                        <img style="width: 300px" src="https://raw.githubusercontent.com/JacketJK/image/main/uploads/file%20copy.png" alt="lock-image" class="lock-image">
                        <h3 class="text-secondary mt-3">ไม่มีข้อมูล</h3>
                    </div>
                </td>
            </tr>
        `);

        $('#salaryCountNo2').text("0");
        $('#salaryCountNo3').text("0");
    } else {
        const formattedData = data.map((row) => {
            revenue += row[5];
            expense += row[6];

            const actions = `<button class="btn rounded-circle" onclick="manageDataSalary('${row[0]}')">
                                <i class="fa-regular fa-pen-to-square"></i>
                             </button>`;
            const user = `<div class="d-flex align-items-center">
                                <img src="${row[22]}" alt="User Image" class="rounded-circle object-fit-cover me-3" style="width: 45px; height: 45px;">
                                <div class="text-start">
                                    <span>${row[12]}${row[13]} ${row[14]}</span><br>
                                    <span class="font-size-12">${row[9]}</span>
                                </div>
                            </div>`;

            const income = row[5].toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
            const expenses = row[6].toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
            const total = row[7].toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
            const month = convertToThaiDate(row[2]); 

            return {
                ...row,
                employee: user,
                month ,
                income,
                expenses,
                total,
                actions,
            };
        });

        $('#salaryCountNo2').text("+" + revenue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
        $('#salaryCountNo3').text("-" + expense.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

        $('#table_DashboradEmployeeSalary').bootstrapTable('load', formattedData);

};

function populateYearFilters(selector) {
    const currentYear = new Date().getFullYear() + 543; 
    const startYear = currentYear - 10; 
    const endYear = currentYear + 10; 
    const selectElements = document.querySelectorAll(selector); 

    selectElements.forEach(selectElement => {
        selectElement.innerHTML = '';

        for (let year = startYear; year <= endYear; year++) {
            const option = document.createElement('option');
            option.value = year; 
            option.textContent = year; 

            if (year === currentYear) {
                option.selected = true;
            }
            selectElement.appendChild(option);
        }
    });
}

populateYearFilters('.year-filter');
