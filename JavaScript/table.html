<script>
// ==========================================
// ระบบฟิลเตอร์ ค้นหา และแบ่งหน้าของหน้าแรก
// ==========================================
const homeDocSendState = {
  data: [],
  searchTerm: '',
  statusFilter: 'all',
  limit: 5,
  currentPage: 1
};

const homeDocOwnerState = {
  data: [],
  searchTerm: '',
  statusFilter: 'all',
  limit: 5,
  currentPage: 1
};

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderPaginationUI(containerId, currentPage, totalPages, onPageChange) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = '';

  // ปุ่มก่อนหน้า
  const prevDisabled = currentPage === 1 ? 'disabled' : '';
  html += `<li class="page-item ${prevDisabled}">
    <a class="page-link" href="#" data-page="${currentPage - 1}" aria-label="Previous">
      <i class="fa-solid fa-chevron-left" style="font-size:13px;"></i>
    </a>
  </li>`;

  // คำนวณช่วงเลขหน้าที่จะแสดง (สูงสุด 5 หน้า)
  let startPage = Math.max(1, currentPage - 2);
  let endPage = Math.min(totalPages, startPage + 4);
  if (endPage - startPage < 4) {
    startPage = Math.max(1, endPage - 4);
  }

  if (startPage > 1) {
    html += `<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>`;
    if (startPage > 2) {
      html += `<li class="page-item disabled"><span class="page-link" style="padding: 0.25rem 0.5rem;">...</span></li>`;
    }
  }

  for (let p = startPage; p <= endPage; p++) {
    const activeClass = p === currentPage ? 'active' : '';
    html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" data-page="${p}">${p}</a></li>`;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      html += `<li class="page-item disabled"><span class="page-link" style="padding: 0.25rem 0.5rem;">...</span></li>`;
    }
    html += `<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`;
  }

  // ปุ่มถัดไป
  const nextDisabled = currentPage === totalPages ? 'disabled' : '';
  html += `<li class="page-item ${nextDisabled}">
    <a class="page-link" href="#" data-page="${currentPage + 1}" aria-label="Next">
      <i class="fa-solid fa-chevron-right" style="font-size:13px;"></i>
    </a>
  </li>`;

  container.innerHTML = html;

  $(container).find('a.page-link').off('click').on('click', function(e) {
    e.preventDefault();
    const targetPage = parseInt($(this).attr('data-page'), 10);
    if (targetPage && targetPage >= 1 && targetPage <= totalPages && targetPage !== currentPage) {
      onPageChange(targetPage);
    }
  });
}

function renderHomeDocSendTable() {
  const tableBody = document.getElementById("docsendTable-body");
  if (!tableBody) return;

  // 1. กรองข้อมูลตามสถานะและคำค้นหา
  let filtered = homeDocSendState.data.filter(item => {
    if (homeDocSendState.statusFilter !== 'all') {
      if (String(item.status) !== String(homeDocSendState.statusFilter)) return false;
    }
    if (homeDocSendState.searchTerm) {
      const q = homeDocSendState.searchTerm.toLowerCase().trim();
      const statusTextMap = { 0: 'ยังไม่ได้เปิด', 1: 'เปิดแล้ว', 2: 'ส่งตีกลับ', 3: 'เกษียนแล้ว', '-1': 'ยกเลิกแล้ว' };
      const sendType = item.isOriginal ? 'ส่งต้นฉบับ' : 'ไม่ส่งต้นฉบับ';
      const textToSearch = `${item.docNum} ${item.subject} ${item.senderName} ${item.senderAgency} ${item.dateStr} ${sendType} ${statusTextMap[item.status] || ''}`.toLowerCase();
      if (!textToSearch.includes(q)) return false;
    }
    return true;
  });

  const totalCount = filtered.length;
  const limitVal = homeDocSendState.limit;
  const pageSize = limitVal === 'all' ? (totalCount || 1) : parseInt(limitVal, 10);
  const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));

  if (homeDocSendState.currentPage > totalPages) {
    homeDocSendState.currentPage = totalPages;
  }
  const currentPage = homeDocSendState.currentPage;
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, totalCount);
  const pagedData = limitVal === 'all' ? filtered : filtered.slice(startIndex, endIndex);

  // 2. เรนเดอร์แถวตาราง
  if (totalCount === 0) {
    tableBody.innerHTML = `<tr>
      <td class="text-center py-4 text-danger" colspan="4">
        <i class="fa fa-info-circle text-danger me-1"></i> <span class="text-danger">ไม่พบข้อมูล!</span>
      </td>
    </tr>`;
  } else {
    const statusMap = {
      0: '<i class="fa-duotone fa-envelope text-warning fa-xl" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="ยังไม่ได้เปิด"></i>',
      1: '<i class="fa-duotone fa-envelope-open-text fa-xl" style="color: var(--box2)" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="เปิดแล้ว"></i>',
      2: '<i class="fa-duotone fa-share-all fa-flip-horizontal fa-xl" style="color: var(--box4)" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="ส่งตีกลับ"></i>',
      3: '<i class="fa-duotone fa-pencil fa-xl" style="color: var(--box3)" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="เกษียนแล้ว"></i>',
      '-1': '<i class="fa-duotone fa-circle-xmark fa-xl text-danger" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="ยกเลิกแล้ว"></i>',
    };

    let html = '';
    for (let i = 0; i < pagedData.length; i++) {
      const item = pagedData[i];
      const sendHtml = item.isOriginal
        ? '<span style="color:green; font-size:12px;">ส่งต้นฉบับ</span>'
        : '<span style="color:red; font-size:12px;">ไม่ส่งต้นฉบับ</span>';

      const fromText = `${item.senderName} (${item.senderAgency})`;
      const statusIcon = statusMap[item.status] || '';
      const isCancelled = String(item.status) === '-1';
      const rowClass = isCancelled ? ' class="doc-cancelled"' : '';
      const rowStyle = isCancelled ? ' style="opacity: 0.5;"' : '';

      html += `<tr${rowClass}${rowStyle}>
        <td>
          <div class="d-flex flex-column">
            <span class="text-primary text-nowrap" style="font-size:14px; cursor: pointer;" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="คลิกเพื่อเปิด" onclick="docdetailOpenfile('${item.docId}', '${item.receiptId}', '${item.receiptParam9}')">
              ${escapeHtml(item.docNum)}
            </span>
            ${sendHtml}
          </div>
        </td>
        <td class="text-center" style="font-size:14px;">${escapeHtml(item.dateStr)}</td>
        <td>
          <span style="font-size:14px; font-weight: 500;">${escapeHtml(item.subject)}</span><br>
          <span class="text-primary" style="font-size:12px;">จาก : </span><span style="font-size:12px;">${escapeHtml(fromText)}</span>
        </td>
        <td class="text-center">${statusIcon}</td>
      </tr>`;
    }
    tableBody.innerHTML = html;

    const tooltipTriggerList = tableBody.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
  }

  // 3. ปรับปรุงข้อมูลสรุปและ Pagination
  const infoEl = document.getElementById("infoDocSend");
  if (infoEl) {
    if (totalCount === 0) {
      infoEl.textContent = 'ไม่พบข้อมูล';
    } else {
      infoEl.innerHTML = `แสดง <strong>${startIndex + 1}</strong> - <strong>${endIndex}</strong> จาก <strong>${totalCount}</strong> รายการ` +
        (homeDocSendState.data.length !== totalCount ? ` <span class="text-muted">(กรองจากทั้งหมด ${homeDocSendState.data.length})</span>` : '');
    }
  }

  renderPaginationUI('paginationDocSend', currentPage, totalPages, function(page) {
    homeDocSendState.currentPage = page;
    renderHomeDocSendTable();
  });
}

function initHomepageFilters() {
  // --- DocSend (ลงรับล่าสุด) ---
  $('#searchDocSend').off('input').on('input', function() {
    const val = $(this).val();
    $('#clearSearchDocSend').toggle(val.length > 0);
    homeDocSendState.searchTerm = val;
    homeDocSendState.currentPage = 1;
    renderHomeDocSendTable();
  });

  $('#clearSearchDocSend').off('click').on('click', function() {
    $('#searchDocSend').val('');
    $(this).hide();
    homeDocSendState.searchTerm = '';
    homeDocSendState.currentPage = 1;
    renderHomeDocSendTable();
  });

  $('#statusFilterDocSend').off('change').on('change', function() {
    homeDocSendState.statusFilter = $(this).val();
    homeDocSendState.currentPage = 1;
    renderHomeDocSendTable();
  });

  $('#limitDocSend').off('change').on('change', function() {
    homeDocSendState.limit = $(this).val();
    homeDocSendState.currentPage = 1;
    renderHomeDocSendTable();
  });

  // --- DocOwner (หนังสือส่งล่าสุด) ---
  $('#searchDocOwner').off('input').on('input', function() {
    const val = $(this).val();
    $('#clearSearchDocOwner').toggle(val.length > 0);
    homeDocOwnerState.searchTerm = val;
    homeDocOwnerState.currentPage = 1;
    renderHomeDocOwnerTable();
  });

  $('#clearSearchDocOwner').off('click').on('click', function() {
    $('#searchDocOwner').val('');
    $(this).hide();
    homeDocOwnerState.searchTerm = '';
    homeDocOwnerState.currentPage = 1;
    renderHomeDocOwnerTable();
  });

  $('#statusFilterDocOwner').off('change').on('change', function() {
    homeDocOwnerState.statusFilter = $(this).val();
    homeDocOwnerState.currentPage = 1;
    renderHomeDocOwnerTable();
  });

  $('#limitDocOwner').off('change').on('change', function() {
    homeDocOwnerState.limit = $(this).val();
    homeDocOwnerState.currentPage = 1;
    renderHomeDocOwnerTable();
  });
}

const refreshDocSendTable = (btn) => {
  const $icon = $(btn).find('i');
  $icon.addClass('fa-spin');
  const publicKey = localStorage.getItem('publicKey');
  insertDataDocSend(publicKey);
};

const refreshDocOwnerTable = (btn) => {
  const $icon = $(btn).find('i');
  $icon.addClass('fa-spin');
  const publicKey = localStorage.getItem('publicKey');
  insertDataDocOwner(publicKey);
};

const insertDataDocSend = (key) => {
  initHomepageFilters();
  google.script.run.withSuccessHandler(function(data) {
    $('#refreshDocSendBtn i').removeClass('fa-spin');
    if (!data || !data[1] || data[1].length === 0) {
      $('#countingDocNo1').text('0');
      $('#badgeDocSendCount').text('0');
      homeDocSendState.data = [];
      renderHomeDocSendTable();
      return;
    }

    let pairedList = [];
    let waitingReceive = 0;

    for (let i = 0; i < data[1].length; i++) {
      const receipt = (data[0] && data[0][i]) ? data[0][i] : [];
      const doc = data[1][i];
      const statusVal = receipt[3] !== undefined ? receipt[3] : 0;
      if (statusVal == 0) {
        waitingReceive++;
      }
      pairedList.push({
        docId: doc[0],
        receiptId: receipt[0] || '',
        receiptParam9: receipt[9] || '',
        docNum: doc[2] || '',
        subject: doc[7] || '',
        senderName: doc[3] || '',
        senderAgency: doc[4] || '',
        isOriginal: doc[16] == 1,
        dateStr: doc[24] || '',
        status: statusVal
      });
    }

    pairedList.sort((a, b) => String(b.docId).localeCompare(String(a.docId)));
    $('#countingDocNo1').text(waitingReceive);
    $('#badgeDocSendCount').text(pairedList.length);

    homeDocSendState.data = pairedList;
    renderHomeDocSendTable();
  }).withFailureHandler(function(err) {
    $('#refreshDocSendBtn i').removeClass('fa-spin');
    console.error("Error loading DocSend:", err);
  }).dataDocInprogress(key);
};

const insertDataDocOwner = (key) => {
  initHomepageFilters();
  google.script.run.withSuccessHandler(function(data) {
    $('#refreshDocOwnerBtn i').removeClass('fa-spin');
    if (!data || !Array.isArray(data) || data.length === 0) {
      $('#countingDocNo2').text('0');
      $('#countingDocNo3').text('0');
      $('#badgeDocOwnerCount').text('0');
      homeDocOwnerState.data = [];
      renderHomeDocOwnerTable();
      return;
    }

    data = data.filter((row) => {
      return row[1] === "หนังสือส่งภายใน" || row[1] === "หนังสือส่งภายใน (แจ้งเวียน)";
    });

    let bounceBook = 0;
    let pendingBooks = 0;
    let ownerList = [];

    for (let i = 0; i < data.length; i++) {
      const row = data[i];
      if (row[15] == 1 && row[22] <= 4) bounceBook++;
      if (row[22] != 0 && row[22] <= 2) pendingBooks++;

      ownerList.push({
        docId: row[0],
        docNum: row[2] || '',
        date: row[9] ? formatThaiDateTime(new Date(row[9])) : '',
        subject: row[7] || '',
        fromName: row[3] || '',
        fromOrg: row[4] || '',
        toName: row[5] || '',
        toOrg: row[6] || '',
        isOriginal: row[16] == 1,
        status: row[22]
      });
    }

    ownerList.sort((a, b) => String(b.docId).localeCompare(String(a.docId)));
    $('#countingDocNo2').text(pendingBooks);
    $('#countingDocNo3').text(bounceBook);
    $('#badgeDocOwnerCount').text(ownerList.length);

    homeDocOwnerState.data = ownerList;
    renderHomeDocOwnerTable();
  }).withFailureHandler(function(err) {
    $('#refreshDocOwnerBtn i').removeClass('fa-spin');
    console.error("Error loading DocOwner:", err);
  }).dataDocInside(key);
};  
function insertActiveData(user) {
  var tableBody = document.getElementById("historyActiveTable-body");
  
  google.script.run.withSuccessHandler(function(data) {

    if (data.length === 0) {
      var noDataRow = document.createElement("tr");
      var noDataCell = document.createElement("td");
      
      noDataCell.innerHTML = "<i class='fa-solid fa-circle-info text-danger'></i> ไม่พบข้อมูล!";
      noDataCell.className = "fw-bold text-danger text-center p-4";
      noDataCell.colSpan = "5"; 
      noDataRow.appendChild(noDataCell);
      tableBody.innerHTML = "";
      tableBody.appendChild(noDataRow);
      return;
    }

    for (var i = 0; i < data.length; i++) {
      var row;
      if (i < tableBody.rows.length) {
        row = tableBody.rows[i];
      } else {
        row = tableBody.insertRow(i);
      }
      
      var cell = row.insertCell(0);
      let num = i + 1;
      cell.innerHTML = num;

      var cell1 = row.insertCell(1);
      var status = '';
      if (data[i][4] === "Login") {
        status = "<span class='badge badge-success rounded-4'><i class='fa-regular fa-right-to-bracket'></i> Login</span>";
      } else if (data[i][4] === "Logout") {
        status = "<span class='badge badge-danger rounded-4'><i class='fa-regular fa-right-to-bracket fa-flip-horizontal'></i> Logout</span>";
      }
      cell1.innerHTML = status;

      var cell2 = row.insertCell(2);
      cell2.innerHTML = data[i][1];

      const parts = data[i][2].split(',');
      const result = parts[0] + ',' + parts[2];

      var cell3 = row.insertCell(3);
      cell3.innerHTML = result;

      var cell4 = row.insertCell(4);
      cell4.innerHTML = data[i][3];      
    }
    for (var i = 0; i < tableBody.rows.length; i++) {
      while (tableBody.rows[i].cells.length > 5) {
        tableBody.rows[i].deleteCell(tableBody.rows[i].cells.length - 1);
      }
    }
  }).checkActive(user); 
}

      if (data[1][i][3] !== undefined) {
        status =  '<span style="color: var(--box2)"><i class="fa-duotone fa-receipt fa-lg"></i> ชำระแล้ว</span>';
      } else {
        status = '<span style="color: var(--box4)"><i class="fa-duotone fa-coin fa-lg"></i> ยังไม่ชำระ</span>';
      }
      cell8.innerHTML = status;

      var cell9 = row.insertCell(9);
      var btn;
      if (data[1][i][3] !== undefined) {
        btn =  `<button class="btn btn-green btn-sm rounded-4" onclick="seefeeTrash('${data[1][i]}')"><i class="fa-solid fa-check-to-slot"></i></button>`;
      } else {
        btn = `<button class="btn btn-yellow btn-sm rounded-4" onclick="feeTrashSave('${data[0][i]}')"><i class="fa-solid fa-cloud-arrow-down"></i></button>`;
      }
      cell9.innerHTML = btn;
    }
    for (var i = 0; i < tableBody.rows.length; i++) {
      while (tableBody.rows[i].cells.length > 10) {
        tableBody.rows[i].deleteCell(tableBody.rows[i].cells.length - 1);
      }
    } 
    $('#trashFeeTable').bootstrapTable({
      pagination: true,
      locale: 'th-TH',
      classes: 'table',
      pageSize: 10,
      pageList: [10, 20, 50, 100],
    });
    $("#feeTrashfilter5").on("input", function() {
      var searchText = $(this).val().toLowerCase();
      var rows = $("#trashFeeTable-body").find("tr");

      rows.each(function() {
        var dataAllSearch = $(this).text().toLowerCase();
        if (dataAllSearch.includes(searchText)) {
          $(this).show();
        } else {
          $(this).hide();
        }
      });
    });
   $('#feeTrashfilter3, #feeTrashfilter4').on('change', function() {
      const selectedValue3 = $('#feeTrashfilter3').val();
      const selectedValue4 = $('#feeTrashfilter4').val();

      $('#trashFeeTable-body tr').each(function(i) {
        const address = data[0][i][5].split(' ');
        let status = 0;
        if (data[1][i][3] !== undefined) {
          status = 1;
        }

        var showByMoo = selectedValue3 === "" || address[3] === selectedValue3;
        var showByStatus = selectedValue4 === "" || status == selectedValue4;

        if (showByMoo && showByStatus) {
          $(this).show();
        } else {
          $(this).hide();
        }
      });
    });
    $('.loadContianer').addClass('d-none');
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
  }).getfeeTrashData(year, month);
}
