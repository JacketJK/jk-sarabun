const insertDataBroadcast = async () => {
  var tableBody = document.getElementById("broadcastTable-body");

  google.script.run.withSuccessHandler(function(data) {

  if (data.length === 0) {
    var noDataRow = document.createElement("tr");

    noDataCell.className = "fw-bold text-danger text-center p-4";
    noDataCell.colSpan = "4"; 

    noDataRow.appendChild(noDataCell);
    tableBody.innerHTML = "";
      tableBody.appendChild(noDataRow);
    return;
  }

  var filteredData = [];
  for (var j = 0; j < data.length; j++) { 
      var tokenValue = data[j][14]; 
      if (tokenValue !== "") {
          filteredData.push(data[j]);
      }
  }

  filteredData.sort((a, b) => a[8].localeCompare(b[8]));

    for (var i = 0; i < filteredData.length; i++) { 
      var row;
      if (i < tableBody.rows.length) {
        row = tableBody.rows[i];
      } else {
        row = tableBody.insertRow(i);
      }
        
      var cell = row.insertCell(0);
      let num = i + 1;
      cell.innerHTML = `<div><input class="form-check-input fs-4" type="checkbox" value="${filteredData[i][14]}" name="baordCastTokrn" id="baordCastTokrn_${num}"><div>`;

      var cell1 = row.insertCell(1);
      cell1.innerHTML = num + '. ' + filteredData[i][3] + filteredData[i][4] + ' ' + filteredData[i][5];

      var cell2 = row.insertCell(2);
      cell2.innerHTML = `<span>${filteredData[i][7]} <span class="opacity-50">(${filteredData[i][6]})</span></span>`;

      var cell3 = row.insertCell(3);
      var right = '';
      if (filteredData[i][8] === "1") {
        right = `<span style="color: var(--blue);font-size: 12px;"><i class="fa-solid fa-gear-complex-code fa-lg" ></i> ผู้ดูแลระบบ</span>`;
      } else if (filteredData[i][8] === "2") {
        right = `<span style="color: var(--box2);font-size: 12px;"><i class="fa-solid fa-user-tie fa-lg"></i> ผู้บริหาร</span>`;
      } else if (filteredData[i][8] === "3") {
        right = `<span style="color: var(--yellow);font-size: 12px;"><i class="fa-solid fa-book fa-lg"></i> งานสารบรรณ</span>`;
      } else if (filteredData[i][8] === "4") {
        right = `<span style="color: var(--box3);font-size: 12px;"><i class="fa-solid fa-books fa-lg"></i> สารบรรณหน่วยย่อย</span>`;
      } else if (filteredData[i][8] === "5") {
        right = `<span style="color: var(--box4);font-size: 12px;"><i class="fa-solid fa-file-signature fa-lg"></i> ผู้ปฏิบัติงาน</span>`;
      } 
      cell3.innerHTML = right;
    }
    for (var i = 0; i < tableBody.rows.length; i++) {
      while (tableBody.rows[i].cells.length > 4) {
        tableBody.rows[i].deleteCell(tableBody.rows[i].cells.length - 1);
      }
    }
  }).getDataUser();  
}
