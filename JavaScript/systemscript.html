<script>
let dataAliveHrm;

$('#hrmfilter2, #hrmfilter1').on('input change', function() {
  const filter1Text = $('#hrmfilter1').val();
  const filter2Text = $('#hrmfilter2').val();
  searchDataHrm(filter1Text, filter2Text);
});

const searchDataHrm = (searchText1, searchText2) => {
  let filteredData = dataAliveHrm;

  if (searchText1 !== '') {
    filteredData = filteredData.filter(item => {
      return item[5] === searchText1;
    });
  }
  if (searchText2 !== '') {
    filteredData = filteredData.filter(item => {
      return item[2].toLowerCase().includes(searchText2.toLowerCase()) || item[3].toLowerCase().includes(searchText2.toLowerCase()) || item[4].toLowerCase().includes(searchText2.toLowerCase()) || item[6].toLowerCase().includes(searchText2.toLowerCase());
    });
  }

  displayCardsHrm(filteredData);
};

const displayCardsHrm = (data) => {
  const dataContainer = $('#hrm-Cardemployee')[0];
  dataContainer.innerHTML = '';
  counting1 = data.length;
  counting2 = counting3 = counting4 = 0;

  data.sort((a, b) => String(a[5] || "").localeCompare(String(b[5] || "")));

  data.forEach(item => {
    if (item[5] === "ข้าราชการ") {
      counting2++;
    } else if (item[5] === "พนักงานจ้าง") {
      counting3++;
    } else if (item[5] === "ลูกจ้างประจำ") {
      counting4++;
    }

    var col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `

        <div class="image"><img src="${item[9]}"></div>
        <div class="card-info">

          <p>${item[6]}</p>

        <a onclick="loadDateHrm('${item}')" class="button">ดูโปรไฟล์</a>
      </div>
    `;
    dataContainer.appendChild(col);
  });

  $('#countingHrm1').text(counting1);
  $('#countingHrm2').text(counting2);
  $('#countingHrm3').text(counting3);
  $('#countingHrm4').text(counting4);

    noDataText.className = "col-md-12 fw-medium text-danger fs-4 text-center p-5";

    return;

};
const loadDateHrm = (data) => {
  const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
  const thaiDays = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
  const item = data.split(',');
  $('#hrmDataModal').modal('show');
  $('#dataHrmShowkey').val(item[0]);
  $('#dataHrmShow1').html(`${item[2]}${item[3]} ${item[4]} (${item[6]})`);
  $('#dataHrmShow2').prop('src', item[9]);

  $('#dataHrmShow4').val(item[2]);
  $('#dataHrmShow5').val(item[3]);
  $('#dataHrmShow6').val(item[4]);
  $('#dataHrmShow7').val(item[5]);
  $('#dataHrmShow8').val(item[6]);
  $("#dataHrmShow9, #dataHrmShow10").flatpickr({
    locale: "th",
    disableMobile: true,
    onReady: function(selectedDates, dateStr, instance) {
      $('#dataHrmShow9').val(item[7]);
      $('#dataHrmShow10').val(item[8]);
      instance.setDate(item[7], false); 
      instance.setDate(item[8], false);
    }
  });

  const masked = IMask($('#dataHrmShow3')[0], { mask: "0-0000-00000-00-0" });

  function calculateAge(birthDate, currentDate) {
    let ageYears = currentDate.getFullYear() - birthDate.getFullYear();
    let ageMonths = currentDate.getMonth() - birthDate.getMonth();
    let ageDays = currentDate.getDate() - birthDate.getDate();
    if (ageDays < 0) {
        ageDays += 30;
        ageMonths -= 1;
    }
    if (ageMonths < 0) {
        ageMonths += 12;
        ageYears -= 1;
    }
    return {
        years: ageYears,
        months: ageMonths,
        days: ageDays
    };
  }
  var birthYear = item[7].split('-');
  var hireYear = item[8].split('-');
  function calculateRetirement() {
    const birthDate = new Date(item[7]);
    const hireDate = new Date(item[8]);
    const currentDate = new Date();
    const age = calculateAge(birthDate, currentDate);
    const retirementYear = (birthDate.getMonth() > 9 || (birthDate.getMonth() == 9 && birthDate.getDate() >= 2))
                ? parseInt(birthYear[0]) + 61
                : parseInt(birthYear[0]) + 60;
    const retirementDate = new Date(retirementYear, 8, 30);
    const serviceTime = retirementDate - hireDate;
    const years = Math.floor(serviceTime / (365.25 * 24 * 60 * 60 * 1000));
    const months = Math.floor((serviceTime % (365.25 * 24 * 60 * 60 * 1000)) / (30.44 * 24 * 60 * 60 * 1000));
    const days = Math.floor((serviceTime % (30.44 * 24 * 60 * 60 * 1000)) / (24 * 60 * 60 * 1000)+2);
    const remainingTime = retirementDate - currentDate;
    const remainingYears = Math.floor(remainingTime / (365.25 * 24 * 60 * 60 * 1000));
    const remainingMonths = Math.floor((remainingTime % (365.25 * 24 * 60 * 60 * 1000)) / (30.44 * 24 * 60 * 60 * 1000));
    const remainingDays = Math.floor((remainingTime % (30.44 * 24 * 60 * 60 * 1000)) / (24 * 60 * 60 * 1000));
    document.getElementById('resultDatahrmShow').innerHTML = `
        วันเกิด: ${birthDate.getDate()} ${thaiMonths[birthDate.getMonth()]} ${parseInt(birthYear[0]) + 543} (${thaiDays[birthDate.getDay()]})
        <br>วันที่บรรจุราชการ: ${hireDate.getDate()} ${thaiMonths[hireDate.getMonth()]} ${parseInt(hireYear[0]) + 543}
        <br>อายุ: ${age.years} ปี ${age.months} เดือน ${age.days} วัน
        <br>วันที่เกษียณอายุราชการ: 1 ${thaiMonths[9]} ${parseInt(retirementYear) + 543}
        <br>อายุราชการในวันเกษียณ: ${years} ปี ${months} เดือน ${days} วัน
        <br>อายุราชการที่เหลือ: ${remainingYears} ปี ${remainingMonths} เดือน ${remainingDays} วัน
    `;
  }
  calculateRetirement();

  $('#confirmeditHrmBtn').on('click', () => {
    $('#loader').show();
    var obj = {
      key: $('#dataHrmShowkey').val(),
      data1: $('#dataHrmShow3').val(),
      data2: $('#dataHrmShow4').val(),
      data3: $('#dataHrmShow5').val(),

      data5: $('#dataHrmShow7').val(),
      data6: $('#dataHrmShow8').val(),
      data7: $('#dataHrmShow9').val(),
      data8: $('#dataHrmShow10').val(),
    }
    google.script.run.withSuccessHandler(() => {
      toastAlert(1, '✨ แก้ไขข้อมูลสำเร็จ');
      $('#hrmDataModal').modal('hide');
      changePageHrm(1);
    }).editDataEmployee(obj);
  });
}

const formatToDateCardThai = (date) => {
  var thaiMonths = [
    'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
    'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
  ];
  var thaiMonth = thaiMonths[date.getMonth()];
  var thaiYear = date.getFullYear() + 543;
  var thaiDate = date.getDate() + ' ' + thaiMonth + ' ' + thaiYear;
  return thaiDate;
}
const formatToDateCardEndThai = (date) => {
  var thaiMonths = [
    'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
    'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
  ];
  var thaiMonth = thaiMonths[date.getMonth()];
  var thaiYear = date.getFullYear() + 543 + 6;

  var thaiday = date.getDate();
  if (thaiday === 1) {
    var lastDayOfPreviousMonth = new Date(date.getFullYear(), date.getMonth(), 0);
    thaiday = lastDayOfPreviousMonth.getDate();
    thaiMonth = thaiMonths[lastDayOfPreviousMonth.getMonth()];
    thaiYear = lastDayOfPreviousMonth.getFullYear() + 543 + 6;
  } else {
    thaiday -= 1;
  }

  var thaiDate = thaiday + ' ' + thaiMonth + ' ' + thaiYear;
  return thaiDate;
}

const dropDownListSL = (obj)=> {
  var colA = document.getElementById('savelandSearch1');
  var colB = document.getElementById('savelandSearch2');

  for (var x in obj) {
    colA.options[colA.options.length] = new Option(x, x);
  }

  colA.onchange = function () {
    colB.length = 0;

    var defaultOption = document.createElement("option");
    defaultOption.text = "โปรดเลือกชื่อโครงการ";
    defaultOption.value = "";
    defaultOption.selected = true;
    defaultOption.disabled = false;
    colB.add(defaultOption);

    for (var i = 0; i < obj[this.value].length; i++) {
      colB.options[colB.options.length] = new Option(obj[this.value][i], obj[this.value][i]);
    }
  }
}
$('#addNewSaveLand12').on('change', (event) => {
  const file = event.target.files[0];

  if (file) {
    const reader = new FileReader();
    $('#pdf-preview').show();
    reader.onload = (e) => {
      const pdfData = e.target.result;

      pdfjsLib.getDocument({ data: pdfData }).promise.then((pdf) => {
        pdf.getPage(1).then((page) => {
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: 1 });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
              canvasContext: context,
              viewport: viewport
          };

          page.render(renderContext).promise.then(() => {
            $('#pdf-preview').empty().append(canvas);
            $('#pdf-preview-container').show();
            $("#page21").stop().animate({ scrollTop: $(document).height() }, 500);
          });
        });
      });
    };

    reader.readAsArrayBuffer(file);
  }
});
