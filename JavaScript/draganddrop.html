      }
      google.script.run.withSuccessHandler((res) => {
        toastAlert(1, '🎊 แก้ไขข้อมูลสำเร็จ');
        $('#agencySetModal').modal('hide');

        populateListAgency(res);
        insertAgencySet(res);

    };

const _populateSortableListGeneric = (listId, data, saveOrderFunc) => {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';
  if (!Array.isArray(data)) return;
  data.forEach(function(row) {
    const li = document.createElement('li');
    li.className = 'p-2';
    li.innerHTML = `<i class='fa-solid fa-bars fa-lg me-3'></i> ${row[1] || ''}`;
    li.setAttribute('data-id', row[0]);
    list.appendChild(li);
  });
  if (typeof Sortable !== 'undefined') {
    new Sortable(list, {
      onEnd: function() {
        const items = list.getElementsByTagName('li');
        const order = [];
        for (let i = 0; i < items.length; i++) {
          order.push(items[i].getAttribute('data-id'));
        }
        if (typeof saveOrderFunc === 'function') {
          saveOrderFunc(order);
        }
      }
    });
  }
};

  google.script.run.withSuccessHandler((data) => {
    dataEquipCategorySet = data;

    if (typeof initEquipFormDropdowns === 'function') initEquipFormDropdowns();
  }).getEquipCategorySet();
};
