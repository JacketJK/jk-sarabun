<script>
const updateUploadedFiles = (count) => {
  const uploadedFilesDiv = document.getElementById('uploadedFiles');
  uploadedFilesDiv.innerHTML = '';

  const documentKey = $("#docViewKey").text();

  if (count === 0) {
    uploadedFilesDiv.innerHTML = '<i class="fa-solid fa-circle-info"></i>   ไม่มีไฟล์แนบ';
  } else {
    const files = Array.from({ length: count }, (_, i) => document.getElementById(`addFileDataDoc${i + 1}`).files[0]);

    files.forEach((file, i) => {
      const fileExtension = file.name.split('.').pop().toLowerCase();

      const fileTypeImg = document.createElement('img');
      fileTypeImg.className = "ms-5";
      fileTypeImg.width = 100;
      fileTypeImg.height = 100;

      switch (fileExtension) {
        case 'pdf':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1jMKlm296bpHkQuoKec6fTFjOLIWKpFba';
          break;
        case 'doc':
        case 'docx':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1qiu8MGW7b1-7Y7PP12Sbo_m3lAmoQlig'; 
          break;
        case 'xlsx':
        case 'xls':
        case 'csv':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1U5WgQpYsjp1ECNR-vyPXkpUGZgHFvnRo';
          break; 
        case 'pptx':
        case 'ppt':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1qOkSfLmXYK2C1YltQKYVvrulRTy-wsAY'; 
          break; 
        case 'zip':
        case 'rar':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1oi8CRjDrw4kBllOq0pdU-KBCssgcbCc2'; 
          break;
        case 'txt':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1UlBfbL8hIARJOut90xEaMzEhfWMxVj9l'; 
        case 'jpg':
        case 'png':
        case 'jpeg':
        case 'gif':
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/138DFq6UWBcD4tFHGbVIysaqJbHodQkB-';
          break;
        default:
          fileTypeImg.src = 'https://lh3.googleusercontent.com/d/1lB3tznB-9AtlKWuKiJ6eW5sXDAgNHOZp'; 
          break;
      }

      fileTypeImg.setAttribute('data-bs-toggle', 'tooltip');
      fileTypeImg.setAttribute('data-bs-placement', 'top');
      fileTypeImg.setAttribute('data-bs-custom-class', 'custom-tooltip');
      fileTypeImg.setAttribute('data-bs-title', 'คลิกเพื่อดูรายละเอียด');
      fileTypeImg.style.cursor = 'pointer'; 
      fileTypeImg.addEventListener('click', function() {
        window.open(URL.createObjectURL(file), '_blank');
      });
      var colRow = document.createElement("div");
      colRow.style.position = "relative";

      var cancle = document.createElement("img");
      cancle.src = 'https://lh3.googleusercontent.com/d/1vVQxKIeOypyPRcJDsDDMP4b6l6XMknsX'; 
      cancle.setAttribute('data-bs-toggle', 'tooltip');
      cancle.setAttribute('data-bs-placement', 'top');
      cancle.setAttribute('data-bs-custom-class', 'custom-tooltip');
      cancle.setAttribute('data-bs-title', 'ลบผลการรักษานี้');
      cancle.style.width = '20px';
      cancle.style.position = 'absolute';
      cancle.style.right = '0px';
      cancle.style.top = '0px'; 
      cancle.style.cursor = 'pointer'; 
      cancle.style.zIndex = '1';
      cancle.addEventListener('click', function() {
        deleteFile(documentKey, i + 1, colRow);
      }); 

      colRow.appendChild(cancle);
      colRow.appendChild(fileTypeImg);
      uploadedFilesDiv.appendChild(colRow);
    });
    $('#sendResultToUserBtn').show();
  }
  function deleteFile(code, number, elementToRemove) {
    google.script.run.withSuccessHandler(function(response) {
      toastAlert(1, response);
      elementToRemove.remove(); 
    }).deleteFileAtDrive(code, number);
  }
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
}

const isValidURL = (str) => {
  const pattern = new RegExp('^(https?:\\/\\/)?'+ 
    '((([a-zA-Z\\d]([a-zA-Z\\d-]*[a-zA-Z\\d])*)\\.)+[a-zA-Z]{2,}|'+ 
    '((\\d{1,3}\\.){3}\\d{1,3}))'+ 
    '(\\:\\d+)?(\\/[-a-zA-Z\\d%_.~+]*)*'+ 
    '(\\?[;&a-zA-Z\\d%_.~+=-]*)?'+ 
    '(\\#[-a-zA-Z\\d_]*)?$','i');

  return !!pattern.test(str);
}
const loadedFiles = (lengths, links) => {
  const uploadedFilesDiv = document.getElementById('uploadedFiles');
  uploadedFilesDiv.innerHTML = ''; 

  if (lengths === 0) {
    uploadedFilesDiv.innerHTML = '<i class="fa-solid fa-circle-info"></i>  ไม่มีไฟล์แนบ';
    return; 
  }

  const filesContainer = document.createElement('div');
  filesContainer.className = 'd-flex justify-content-center align-items-center'; 
  uploadedFilesDiv.appendChild(filesContainer);

  for (let i = 0; i < lengths; i++) {
    const fileLink = links[i];

    const fileItem = document.createElement('div');
    fileItem.classList.add('file-item', 'ms-5'); 

    const fileImg = document.createElement('img');
    fileImg.src = 'https://cdn.jsdelivr.net/gh/JacketJK/image/archive.png';
    fileImg.setAttribute('data-bs-toggle', 'tooltip');
    fileImg.setAttribute('data-bs-placement', 'top');
    fileImg.setAttribute('data-bs-custom-class', 'custom-tooltip');
    fileImg.setAttribute('data-bs-title', 'คลิกเพื่อดูรายละเอียด');
    fileImg.addEventListener('click', () => window.open(fileLink, '_blank'));
    fileImg.style.cursor = 'pointer';
    fileImg.width = 80;
    fileImg.height = 80;

    fileItem.appendChild(fileImg); 
    filesContainer.appendChild(fileItem); 
  }
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
};


const updateUploadedLinks = () => {
  let linkCount = 0;

  if (isValidURL($("#addFileDatalink1").val()) && $("#addFileDatalink2").val() === "" && $("#addFileDatalink3").val() === "") {
    linkCount = 1;
  } else if (isValidURL($("#addFileDatalink1").val()) && isValidURL($("#addFileDatalink2").val()) && $("#addFileDatalink3").val() === "") {
    linkCount = 2;
  } else if (isValidURL($("#addFileDatalink1").val()) && isValidURL($("#addFileDatalink2").val()) && isValidURL($("#addFileDatalink3").val())) {
    linkCount = 3;
  }

  const uploadedLinksDiv = document.getElementById('uploadedLinks');
  uploadedLinksDiv.innerHTML = '';

  for (let i = 1; i <= linkCount; i++) {
    const inputLink = document.getElementById(`addFileDatalink${i}`);
    const link = inputLink.value;

    if (isValidURL(link)) { 
      const img = document.createElement('img');
      img.src = 'https://cdn.jsdelivr.net/gh/JacketJK/image/img_link.png';

      img.setAttribute('data-bs-custom-class', 'custom-tooltip');
      img.setAttribute('data-bs-title', 'คลิกเพื่อดูรายละเอียด');
      img.addEventListener('click', function() {
        window.open(link, '_blank');
      });

      img.width = 80;
      img.height = 80;
      img.classList.add("ms-5");
      uploadedLinksDiv.appendChild(img);

const onResetFile = () => {
  const uploadedLinksDiv = document.getElementById('uploadedLinks');

const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')

  if (totalPages > maxVisibleButtons) {
    var middleButton = Math.floor(maxVisibleButtons / 2);
    var farthestStart = currentPage - middleButton;
    var farthestEnd = currentPage + middleButton - 1;

    if (farthestStart > 1) {
      startPage = farthestStart;
      if (farthestEnd < totalPages) {
        endPage = farthestEnd;
      } else {
        endPage = totalPages;
        startPage = totalPages - maxVisibleButtons + 1;
      }
    } else {
      startPage = 1;
      endPage = maxVisibleButtons;
    }
  }

    var pageButton = document.createElement("button");

    pageButton.className = "pagination-button fs-5";
    if (i === currentPage) {
      pageButton.disabled = true;
      pageButton.classList.add("active");
    } else {
      pageButton.addEventListener("click", (function (page) {
        return function () {
          currentPage = page;
          approveDataShow(data);
        };
      })(i));
    }
    paginationContainer.appendChild(pageButton);
  }

  if (currentPage < totalPages) {
    var ellipsisButton2 = document.createElement("span");
    ellipsisButton2.textContent = "...";
    paginationContainer.appendChild(ellipsisButton2);

    var lastButton = document.createElement("button");

  var maxVisibleButtons = 5; 
  var startPage = 1;
  var endPage = totalPages;

  if (totalPages > maxVisibleButtons) {
    var middleButton = Math.floor(maxVisibleButtons / 2);
    var farthestStart = currentPage - middleButton;
    var farthestEnd = currentPage + middleButton - 1;

    if (farthestStart > 1) {
      startPage = farthestStart;
      if (farthestEnd < totalPages) {
        endPage = farthestEnd;
      } else {
        endPage = totalPages;
        startPage = totalPages - maxVisibleButtons + 1;
      }
    } else {
      startPage = 1;
      endPage = maxVisibleButtons;
    }
  }

  if (currentPage > 1) {
    var firstButton = document.createElement("button");
    firstButton.textContent = "1";
    firstButton.className = "pagination-button fs-5";

    });

    var ellipsisButton1 = document.createElement("span");
    ellipsisButton1.textContent = "...";
    paginationContainer.appendChild(ellipsisButton1);
  }

  for (var i = startPage; i <= endPage; i++) {
    var pageButton = document.createElement("button");
    pageButton.textContent = i;
    pageButton.className = "pagination-button fs-5";
    if (i === currentPage) {
      pageButton.disabled = true;
      pageButton.classList.add("active");
    } else {
      pageButton.addEventListener("click", (function (page) {
        return function () {
          currentPage = page;
          leaveHeaddDataContainer(data);
        };
      })(i));
    }
    paginationContainer.appendChild(pageButton);
  }

  if (currentPage < totalPages) {
    var ellipsisButton2 = document.createElement("span");
    ellipsisButton2.textContent = "...";
    paginationContainer.appendChild(ellipsisButton2);

    var lastButton = document.createElement("button");
    lastButton.textContent = totalPages;
    lastButton.className = "pagination-button fs-5";
    lastButton.addEventListener("click", function () {
      currentPage = totalPages;
      leaveHeaddDataContainer(data);
    });
    paginationContainer.appendChild(lastButton);
  }

  dataContainer.appendChild(paginationContainer);
}
</script>
