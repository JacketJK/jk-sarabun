<script>

// แปลงรูปแบบวันที่ให้อยู่ในรูป YYYY-MM-DD เพื่อเปรียบเทียบความถูกต้อง
const normalizeDateToYMD = (val) => {
  if (!val) return '';
  if (val instanceof Date && !isNaN(val.getTime())) {
    const y = val.getFullYear();
    const m = String(val.getMonth() + 1).padStart(2, '0');
    const d = String(val.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  let s = String(val).trim().replace(/^'/, '');
  const matchYMD = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (matchYMD) {
    let y = parseInt(matchYMD[1]);
    if (y > 2400) y -= 543;
    const m = String(matchYMD[2]).padStart(2, '0');
    const d = String(matchYMD[3]).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  const matchDMY = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (matchDMY) {
    let y = parseInt(matchDMY[3]);
    if (y > 2400) y -= 543;
    const m = String(matchDMY[2]).padStart(2, '0');
    const d = String(matchDMY[1]).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  const dObj = new Date(s);
  if (!isNaN(dObj.getTime())) {
    let y = dObj.getFullYear();
    if (y > 2400) y -= 543;
    const m = String(dObj.getMonth() + 1).padStart(2, '0');
    const d = String(dObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  return s;
};

  if (!targetDate) {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const d = String(today.getDate()).padStart(2, '0');

  if (dateInput.length) {
    if (!dateInput.data('has-flatpickr')) {
      dateInput.data('has-flatpickr', true);

        locale: "th",
        disableMobile: true,
        defaultDate: targetDate,
        onChange: function(selectedDates, dateStr) {

        }

      if (currentReqId !== meetingRoomReqId) return;

      $('.loadContianer').addClass('d-none');
      dataContainer.innerHTML = '';

      const rawRooms = (data && data[0]) || [];
      const allBookings = (data && data[1]) || [];

        return;
      }

      // ป้องกันการโหลดซ้ำสองรอบ (Deduplicate ห้องประชุม)
      const seenRooms = new Set();
      const uniqueRooms = [];
      rawRooms.forEach((item) => {
        const roomKey = String(item[0] || item[1] || '').trim();
        if (roomKey && !seenRooms.has(roomKey)) {
          seenRooms.add(roomKey);
          uniqueRooms.push(item);
        }
      });

      const selectedYMD = normalizeDateToYMD(currentMeetingFilterDate);

      uniqueRooms.forEach((item, index) => {
        const roomName = String(item[1] || '').trim();

        // กรองการจองของห้องนี้ในวันที่เลือก
        const roomBookings = allBookings.filter((b) => {
          const bRoom = String(b[1] || '').trim();
          if (bRoom !== roomName && bRoom !== String(item[0] || '').trim()) return false;
          // สถานะ 2 = ไม่อนุญาต ให้ข้าม
          if (String(b[10]) === '2') return false;
          const bDate = normalizeDateToYMD(b[2]);
          return bDate === selectedYMD;
        });

        // สร้าง 12 ช่วงเวลา (07:00 ถึง 19:00 น.)
        const timeLabels = [
          '07:00', '08:00', '09:00', '10:00', '11:00', '12:00',

        ];

        let progressBarsHtml = '';
        for (let slot = 1; slot <= 12; slot++) {
          const slotStart = timeLabels[slot - 1];
          const slotEnd = timeLabels[slot];

          // ตรวจสอบว่า slot นี้ถูกจองไปแล้วหรือไม่
          const matchedBooking = roomBookings.find((b) => {
            const startSlot = parseInt(b[3]);
            const duration = parseInt(b[4]) || 1;
            const endSlot = startSlot + duration - 1;
            return slot >= startSlot && slot <= endSlot;
          });

          if (matchedBooking) {
            const bookerName = matchedBooking[8] || 'มีผู้จอง';
            const bStartSlot = parseInt(matchedBooking[3]);
            const bDuration = parseInt(matchedBooking[4]) || 1;
            const bStartTime = timeLabels[bStartSlot - 1] || slotStart;
            const bEndTime = timeLabels[bStartSlot + bDuration - 1] || slotEnd;
            const statusText = String(matchedBooking[10]) === '1' ? 'อนุมัติแล้ว' : 'ขอจองไว้แล้ว';

            progressBarsHtml += `
              <div class="progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 8.3333%;height: 50px;">

              </div>
            `;
          } else {
            progressBarsHtml += `
              <div class="progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 8.3333%;height: 50px;">
                <div class="progress-bar bg-green" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="ว่าง (${slotStart} - ${slotEnd} น.)"></div>
              </div>
            `;
          }
        }

        const contain = document.createElement('div');
        contain.className = "d-flex position-relative mb-2";
        contain.innerHTML = `
          <div style="width: 250px; height: 250px;" class="z-index-5 rounded-circle border border-5 border-light bg-light shadow flex-shrink-0">
            <img src="${item[4] || 'https://placehold.co/250x250'}" class="w-100 h-100 object-fit-cover rounded-circle">
          </div>

            <div class="p-2 ps-4 rounded-pill bg-opacity-25 ms-5 border border-5 border-light shadow" style="background-color: var(--blue);color: var(--light);">

              <div class="row ms-5 ps-3">
                <div class="col-lg-2"></div><span class="col-lg-10">สถานที่ตั้ง : ${item[2] || '-'}</span>
                <div class="col-lg-2"></div><span class="col-lg-10">ความจุ : ${item[3] || '-'} ท่าน</span>
              </div>

                ${progressBarsHtml}

            </div>
            <div class="d-flex justify-content-between align-items-center progress-time">

              <span class="time-span">08:00</span>

        var hr = document.createElement('hr');
        hr.className = "opacity-10 my-3";

    li.appendChild(image);
    li.appendChild(div);

    list.appendChild(li);
  });

  makeListSortableMeetingRoom();
}

const makeListSortableMeetingRoom = () => {
  var list = document.getElementById('sortableMeetingRoom-list');
  new Sortable(list, {
    onEnd: function(evt) {
      saveOrderMeetingRoom();
    }
  });
}

const saveOrderMeetingRoom = () => {
  var list = document.getElementById('sortableMeetingRoom-list');
  var items = list.getElementsByTagName('li');
  var order = [];

  for (var i = 0; i < items.length; i++) {
    order.push(items[i].getAttribute('data-id'));
  }

  google.script.run.saveOrderMeetingRoom(order);
}

</script>

const licenseAvatarImageUpload = () => {
  var input = document.getElementById('dataLicenseInput3_input');

  if (input.files && input.files[0]) {

const licenseCoverImageUpload = () => {
  var input = document.getElementById('dataLicenseInput4_input');
  var img = document.getElementById('dataLicenseInput6');

  if (input.files && input.files[0]) {
      var reader = new FileReader();

const saveFile_License = (f, runnumber) => {
  $('#loader').show();
  const codes = $("#dataLicenseInputKey").val();
  const file = f.files[0];
  const fr = new FileReader();
  fr.onload = function (e) {
    const obj = {
      code: codes,
      filename: codes,
      mimeType: file.type,
      bytes: [...new Int8Array(e.target.result)]
    };
    google.script.run.withSuccessHandler(e => toastAlert(1, e)).saveFileLicense(obj, runnumber);
  };
  fr.readAsArrayBuffer(file);
}
