<script>
const createNotificationElement = (item, data, index, clickHandler) => {
  const isRead = item[7] === 0;
  const profilePic = data[1][index][13];
  const title = item[3];
  const message = item[4];
  const notifyFunction = item[5];
  const notifyParam = item[6];

  const container = document.createElement('a');
  container.className = "py-2 px-3 d-flex align-items-center dropdown-item notify-container";
  container.innerHTML = `
    <span class="me-3">
      <img src="${profilePic}" alt="user" class="rounded-circle" width="48" height="48">
    </span>
    <div class="w-75 d-inline-block v-middle ${isRead ? '' : 'opacity-25'}" onclick="${notifyFunction}('${notifyParam}')">
      <h6 class="mb-0 fw-semibold lh-base limited-text">${title}</h6>
      <span class="d-block limited-text">${message}</span>
    </div>
  `;

  if (!isRead) {
    container.classList.add('hide', 'd-none');
  }

  container.addEventListener('click', clickHandler);

  return container;
};

const displayNotifications = async (key) => {
  const dataContainer = document.getElementById('notificationDiv');
  dataContainer.innerHTML = '';
  let counting = 0;

  google.script.run.withSuccessHandler((data) => {
    if (data[0].length === 0) {
      const noDataText = document.createElement("p");
      noDataText.textContent = "ไม่มีการแจ้งเตือน !";
      noDataText.className = "fw-medium text-danger fs-6 text-center p-5";
      dataContainer.appendChild(noDataText);
      return;
    }

    data[0].forEach((item, index) => {
      const notificationElement = createNotificationElement(item, data, index, () => openNotify(item[0]));
      dataContainer.appendChild(notificationElement);

      if (item[7] === 0) {
        counting++;
      }
    });

    $('#showAllNotify').on('click', function(event) {
      event.stopPropagation();

      const $container = $('.notify-container.hide');
      const $btn = $(this);
      $container.toggleClass("d-none");
      $btn.html($container.hasClass('d-none') ? 'ดูการแจ้งเตือนทั้งหมด' : 'ซ่อนการแจ้งเตือน');
    });

    if (counting !== 0) {
      $('#countingNotify').removeClass('d-none').html(counting);
      $('#countingNotification').removeClass('d-none').html(`ใหม่ ${counting}`);
    } else {
      $('#countingNotify').addClass('d-none');
      $('#countingNotification').addClass('d-none');
    }
  }).noticationShow(key);
};

const openNotify = (key) => {
  google.script.run.withSuccessHandler((user) => {
  }).openNotify(key);
};
</script>
